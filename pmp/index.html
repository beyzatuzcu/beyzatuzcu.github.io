 Çevikte yeni ihtiyaç ürün iş listesine alınır ve ürün sahibi önceliklendirir. Kapsam doğrulama müşteri kabulü, kalite kontrol teknik uygunlukla ilgilidir.","Müşteri teknik olarak doğrulanmış teslimatı resmi olarak kabul ediyor. Hangi süreç?","Kapsam doğrulama","Kalite kontrol","Risk analizi","Kaynak dengeleme"],["Değişiklik ve kapsam","Proje başlatma belgesi projeyi yetkilendirir; kapsam temel çizgisi kapsam bildirimi, iş kırılım yapısı (WBS) ve WBS sözlüğünden oluşur. Gereksinim izlenebilirlik matrisi ihtiyaçları teslimat ve testlerle ilişkilendirir. Öngörücü projede değişiklik talebi kaydedilir, zaman/maliyet/kapsam/kalite/risk etkileri analiz edilir, yetkili merci karar verir; onay sonrası plan ve temel çizgiler güncellenir. Çevikte yeni ihtiyaç ürün iş listesine alınır ve ürün sahibi önceliklendirir. Kapsam doğrulama müşteri kabulü, kalite kontrol teknik uygunlukla ilgilidir.","Onaylı kapsam dışına ekip kendi isteğiyle özellik ekliyor. Bu nedir?","Altın kaplama","Kapsam doğrulama","Kritik yol","Fayda analizi"],["Çevik ve Scrum","Çevik yaklaşım belirsiz gereksinimlerde kısa geri bildirim döngüleriyle değer üretir. Scrum ürün sahibi (Product Owner) ürün değerini ve backlog yönetimini üstlenir; geliştiriciler sprint planını oluşturur ve işi kendileri yönetir; Scrum Master etkinliği destekler ve engellerin kaldırılmasını kolaylaştırır. Sprint Planning hedef ve plan, Daily Scrum geliştiricilerin ilerlemeyi uyarlaması, Review ürün ve paydaş geri bildirimi, Retrospective süreç iyileştirmesidir. Definition of Done ortak kalite ölçütüdür. Kanban akışı görselleştirir, devam eden işi (WIP) sınırlar. Hız (velocity) ekip içi tahmin aracıdır, ekipler arası performans sıralaması değildir.","Ürün iş listesinin sırasından kim hesap verebilir?","Ürün sahibi","Scrum Master","Sponsor","Tedarikçi"],["Çevik ve Scrum","Çevik yaklaşım belirsiz gereksinimlerde kısa geri bildirim döngüleriyle değer üretir. Scrum ürün sahibi (Product Owner) ürün değerini ve backlog yönetimini üstlenir; geliştiriciler sprint planını oluşturur ve işi kendileri yönetir; Scrum Master etkinliği destekler ve engellerin kaldırılmasını kolaylaştırır. Sprint Planning hedef ve plan, Daily Scrum geliştiricilerin ilerlemeyi uyarlaması, Review ürün ve paydaş geri bildirimi, Retrospective süreç iyileştirmesidir. Definition of Done ortak kalite ölçütüdür. Kanban akışı görselleştirir, devam eden işi (WIP) sınırlar. Hız (velocity) ekip içi tahmin aracıdır, ekipler arası performans sıralaması değildir.","Kanban ekibinde çok fazla yarım iş var. Ne yapılmalı?","WIP sınırlarıyla akışı iyileştir","Yeni işleri artır","Tüm işleri eşzamanlı başlat","Hızı bireysel puanla ölç"],["Liderlik ve çatışma","Hizmetkâr liderlik ekibi güçlendirir, engelleri kaldırır ve karar almayı destekler. Çatışma yöntemleri iş birliği/problem çözme, uzlaşma, yumuşatma, zorlama ve geri çekilmedir. İş birliği çoğu kalıcı çözüm için uygundur; acil güvenlik durumunda doğrudan müdahale gerekebilir. Duygusal zekâ öz farkındalık, öz yönetim, empati ve ilişki yönetimini içerir. Ekip sözleşmesi çalışma normlarını belirler. Tuckman modeli oluşum, çatışma, normlaşma, performans ve dağılmadır.","Ekip üyesinin yeni teknoloji bilgisi eksik. İlk uygun yaklaşım?","Eğitim ve koçluk ihtiyacını değerlendir","Üyeyi hemen değiştir","Sorunu gizle","Görevleri iptal et"],["Paydaş ve iletişim","Paydaş kaydı kimleri, rollerini ve beklentilerini tanımlar. Güç/ilgi matrisi yüksek güç-yüksek ilgi grubunu yakından yönetmeyi; yüksek güç-düşük ilgi grubunu memnun tutmayı önerir. Katılım değerlendirme matrisi mevcut ve istenen katılımı karşılaştırır. İletişim planı kime, ne zaman, hangi kanaldan, hangi bilgilerin iletileceğini tanımlar. Etkileşimli iletişim toplantı, push e-posta, pull bilgi deposudur. İletişim kanalı sayısı n(n-1)/2.","8 kişilik ekipte potansiyel iletişim kanalı sayısı?","28","16","56","8"],["Maliyet ve EVM","PV planlanan işin bütçelenmiş değeri; EV tamamlanan işin bütçelenmiş değeri; AC gerçekleşen maliyettir. CV=EV−AC, SV=EV−PV; negatif değer olumsuzdur. CPI=EV/AC, SPI=EV/PV; 1 altı olumsuzdur. BAC toplam bütçe, EAC tamamlanma tahmini, ETC kalan maliyet, VAC=BAC−EAC. Mevcut maliyet performansı sürecekse EAC=BAC/CPI; geçmiş sapma tek seferlikse EAC=AC+(BAC−EV).","EV=120, PV=150, AC=100. SPI nedir?","0,8","1,2","1,5","0,67"],["Maliyet ve EVM","PV planlanan işin bütçelenmiş değeri; EV tamamlanan işin bütçelenmiş değeri; AC gerçekleşen maliyettir. CV=EV−AC, SV=EV−PV; negatif değer olumsuzdur. CPI=EV/AC, SPI=EV/PV; 1 altı olumsuzdur. BAC toplam bütçe, EAC tamamlanma tahmini, ETC kalan maliyet, VAC=BAC−EAC. Mevcut maliyet performansı sürecekse EAC=BAC/CPI; geçmiş sapma tek seferlikse EAC=AC+(BAC−EV).","BAC=500, CPI=0,8 ve performans sürecek. EAC?","625","400","500","125"],["Kalite yönetimi","Kalite planlama standartları ve ölçütleri belirler. Kalite yönetimi süreçlerin uygunluğunu ve iyileştirilmesini, kalite kontrol teslimatların ölçüm ve testini ele alır. Pareto öncelikli hata kategorilerini, Ishikawa olası nedenleri, kontrol grafiği süreç kararlılığını gösterir. Kontrol limitleri süreç davranışını, spesifikasyon limitleri müşteri gereksinimlerini temsil eder. Önleme maliyeti ve değerlendirme maliyeti uygunluk maliyetidir; iç/dış hata maliyetleri uygunsuzluk maliyetidir.","En fazla hata oluşturan kategorileri önceliklendirmek için?","Pareto grafiği","Gantt grafiği","Paydaş matrisi","WBS"],["Tedarik ve sözleşmeler","Yap veya satın al analizi iç kaynak ve dış kaynak seçeneklerini karşılaştırır. Sabit fiyat sözleşmesinde kapsam net olmalıdır; maliyet artışı riski genellikle satıcıdadır. Maliyet geri ödemeli sözleşmede alıcının maliyet riski daha yüksektir. Zaman ve malzeme sözleşmesinde birim fiyatlar belirlenir fakat toplam iş belirsiz olabilir. Tedarik kontrolü performans, değişiklik, hak talepleri ve sözleşme şartlarını izler.","Kapsam net ve fiyat sabit. Maliyet aşımı riski genellikle kimde?","Satıcı","Alıcı","Scrum Master","Müşteri temsilcisi"],["İş değeri ve faydalar","İş gerekçesi yatırımın nedenini ve ekonomik/stratejik değerini açıklar. Fayda yönetimi planı beklenen faydaları, ölçütleri, zamanlamayı ve sahipleri tanımlar. Çıktı üretilen ürün, sonuç kullanımın yarattığı değişim, fayda ölçülebilir değerdir. MVP varsayımları en az uygulanabilir ürünle test eder. Değer teslimatı sadece proje sonunda değil, yaşam döngüsü boyunca izlenebilir.","Ürün teslim edildi ama beklenen tasarruf sağlanmadı. Ne incelenmeli?","Fayda gerçekleşmesi","Sadece teslim tarihi","Sadece ekip büyüklüğü","Sadece sözleşme numarası"],["Takvim ve kaynak","Kritik yol en uzun süreli bağımlılık yoludur ve en erken proje bitişini belirler. Toplam bolluk bir faaliyetin proje bitişini geciktirmeden kayabileceği süredir. FS bitiş-başlangıç, SS başlangıç-başlangıç, FF bitiş-bitiş, SF başlangıç-bitiştir. Crashing ek kaynakla süreyi kısaltır ve maliyeti artırabilir; fast tracking işleri örtüştürür ve yeniden iş riskini artırır. Kaynak dengeleme kritik yolu değiştirebilir. PERT=(iyimser+4×en olası+kötümser)/6.","İyimser 4, en olası 7, kötümser 16. PERT tahmini?","8","9","7","12"],["Takvim ve kaynak","Kritik yol en uzun süreli bağımlılık yoludur ve en erken proje bitişini belirler. Toplam bolluk bir faaliyetin proje bitişini geciktirmeden kayabileceği süredir. FS bitiş-başlangıç, SS başlangıç-başlangıç, FF bitiş-bitiş, SF başlangıç-bitiştir. Crashing ek kaynakla süreyi kısaltır ve maliyeti artırabilir; fast tracking işleri örtüştürür ve yeniden iş riskini artırır. Kaynak dengeleme kritik yolu değiştirebilir. PERT=(iyimser+4×en olası+kötümser)/6.","Kritik faaliyete ek kaynak eklenerek süre azaltılıyor. Nedir?","Crashing","Fast tracking","Risk transferi","Kapsam doğrulama"],["Öğrenme ve retrospektif","Öğrenilen dersler proje boyunca kaydedilir; yalnızca kapanışta hazırlanmaz. Retrospektif ekip çalışma biçimini inceler, uygulanabilir iyileştirme aksiyonları üretir. Review ürün artımını paydaşlarla inceler. Bilgi yönetiminde açık bilgi dokümante edilebilir; örtük bilgi deneyim ve etkileşimle aktarılır. Kapanışta kabul, devir, arşiv, sözleşme kapanışı ve kaynakların serbest bırakılması ele alınır.","Paydaşlar ürün artımını inceliyor. Hangi etkinlik?","Sprint review","Retrospektif","Daily Scrum","Sprint planning"],["Yönetişim, etik ve uyum","Yönetişim karar yetkilerini, hesap verebilirliği ve kontrol mekanizmalarını tanımlar. Uyum gereksinimleri belirlenmeli, izlenmeli ve kanıtlanmalıdır. PMI etik ilkeleri sorumluluk, saygı, adalet ve dürüstlüktür. Çıkar çatışmaları açıklanır; yanlış raporlama kabul edilmez. Güvenlik veya mevzuat ihlali varsa zarar önlenir ve yetkili kanallara uygun bildirim yapılır.","Tedarikçi seçiminde kişisel çıkar ilişkisi fark edildi. Ne yapılmalı?","Çıkar çatışmasını açıklayıp uygun süreci izle","Gizle","Teklifi otomatik onayla","Belgeleri sil"],["AI ve sürdürülebilirlik","Yapay zekâ tahmin, özetleme ve risk tespitini destekleyebilir; karar sorumluluğu insanda kalır. Veri gizliliği, güvenlik, doğruluk, önyargı ve izlenebilirlik değerlendirilmelidir. Sürdürülebilirlik çevresel, sosyal ve ekonomik etkileri yaşam döngüsü boyunca ele alır. Alternatifler yalnızca kısa vadeli maliyetle değil uzun vadeli değer ve riskle değerlendirilir.","AI tahmini proje kararını etkileyecek. Önce ne yapılmalı?","Veri ve tahmini doğrula","Otomatik uygula","Uzmanları dışla","Kaynakları sil"],["Hibrit ve yaklaşım seçimi","Öngörücü yaklaşım kapsam ve gereksinimler istikrarlı olduğunda ayrıntılı ön planlama sağlar. Çevik yaklaşım değişken ihtiyaçlarda kısa geri bildirim ve artımlı değer sağlar. Yinelemeli yaklaşım çözümü tekrarlarla geliştirir; artımlı yaklaşım parçalar halinde teslim eder. Hibrit yaklaşım farklı bileşenlerde uygun yöntemleri birleştirir. Tailoring proje bağlamına göre süreç ve uygulamaları uyarlamaktır.","Süreçleri projenin karmaşıklığına göre uyarlamak?","Tailoring","Crashing","Transfer","Gold plating"]];const L=[["Risk yönetimi","Risk henüz gerçekleşmemiş, belirsiz bir olaydır; olumlu (fırsat) veya olumsuz (tehdit) olabilir. Risk yönetimi planı yöntemleri belirler; risk kaydı tekil riskleri, sahiplerini, tetikleyicilerini ve yanıtlarını içerir. Nitel analiz olasılık ve etkiye göre önceliklendirir; nicel analiz sayısal etkileri tahmin eder. Tehdit yanıtları kaçınma, azaltma, transfer, kabul ve eskalasyondur. Fırsat yanıtları yararlanma, geliştirme, paylaşma, kabul ve eskalasyondur. Artık risk yanıt sonrasında kalan, ikincil risk ise yanıtın doğurduğu yeni risktir. Belirlenmiş riskler için beklenmedik durum rezervi, bilinmeyen belirsizlikler için yönetim rezervi kullanılabilir.","Bir entegrasyonun gecikme ihtimali risk kaydındadır. Gecikme gerçekleşince sorun kaydına alınır, önceden planlanan yanıt değerlendirilir, sorumlu ile aksiyon yürütülür ve etkiler izlenir.","Henüz olabilir → risk kaydı; gerçekleşti → sorun kaydı; olasılık/etki → nitel analiz; parasal dağılım → nicel analiz; sigorta → transfer; nedeni ortadan kaldırma → kaçınma.","Her riski sponsora taşımak, gerçekleşen riski yalnızca risk olarak izlemek, etkiyi değerlendirmeden temel çizgiyi değiştirmek."],["Değişiklik ve kapsam","Proje başlatma belgesi projeyi yetkilendirir; kapsam temel çizgisi kapsam bildirimi, iş kırılım yapısı (WBS) ve WBS sözlüğünden oluşur. Gereksinim izlenebilirlik matrisi ihtiyaçları teslimat ve testlerle ilişkilendirir. Öngörücü projede değişiklik talebi kaydedilir, zaman/maliyet/kapsam/kalite/risk etkileri analiz edilir, yetkili merci karar verir; onay sonrası plan ve temel çizgiler güncellenir. Çevikte yeni ihtiyaç ürün iş listesine alınır ve ürün sahibi önceliklendirir. Kapsam doğrulama müşteri kabulü, kalite kontrol teknik uygunlukla ilgilidir.","Müşteri onaylı ekrana yeni filtre ister. Önce ihtiyacı netleştir, etkiyi değerlendir, değişiklik sürecini uygula. Onaysız geliştirme kapsam kaymasına yol açabilir.","Onaylı temel çizgi → değişiklik kontrolü; müşteri kabulü → kapsam doğrulama; teknik test → kalite kontrol; izlenebilirlik → RTM.","Müşteri istedi diye hemen geliştirmek, tüm çevik değişiklikleri CCB'ye göndermek, altın kaplama yapmak."],["Çevik ve Scrum","Çevik yaklaşım belirsiz gereksinimlerde kısa geri bildirim döngüleriyle değer üretir. Scrum ürün sahibi (Product Owner) ürün değerini ve backlog yönetimini üstlenir; geliştiriciler sprint planını oluşturur ve işi kendileri yönetir; Scrum Master etkinliği destekler ve engellerin kaldırılmasını kolaylaştırır. Sprint Planning hedef ve plan, Daily Scrum geliştiricilerin ilerlemeyi uyarlaması, Review ürün ve paydaş geri bildirimi, Retrospective süreç iyileştirmesidir. Definition of Done ortak kalite ölçütüdür. Kanban akışı görselleştirir, devam eden işi (WIP) sınırlar. Hız (velocity) ekip içi tahmin aracıdır, ekipler arası performans sıralaması değildir.","Bir sprintte yeni istek gelirse ürün sahibi ile değerlendirilir; sprint hedefi korunur, kapsam geliştiricilerle müzakere edilebilir. Hedef geçersizleşirse sprinti iptal etme yetkisi ürün sahibindedir.","Ürün önceliği → PO; engel → Scrum Master; nasıl yapılacak → ekip; süreç iyileştirme → retrospektif; ürün geri bildirimi → review.","Daily Scrum'ı yöneticiye rapor toplantısı yapmak, ekibe görev dayatmak, hız metriklerini rekabet için kullanmak."],["Liderlik ve çatışma","Hizmetkâr liderlik ekibi güçlendirir, engelleri kaldırır ve karar almayı destekler. Çatışma yöntemleri iş birliği/problem çözme, uzlaşma, yumuşatma, zorlama ve geri çekilmedir. İş birliği çoğu kalıcı çözüm için uygundur; acil güvenlik durumunda doğrudan müdahale gerekebilir. Duygusal zekâ öz farkındalık, öz yönetim, empati ve ilişki yönetimini içerir. Ekip sözleşmesi çalışma normlarını belirler. Tuckman modeli oluşum, çatışma, normlaşma, performans ve dağılmadır.","İki uzman anlaşamıyor. Özel görüşme ve ortak oturumla nedenleri öğren, karar kriterlerini belirle, ekibin çözüm üretmesini destekle.","Çatışma → dinle ve kolaylaştır; beceri eksikliği → koçluk/eğitim; ekip normu → ekip sözleşmesi; yetki dışı engel → uygun eskalasyon.","İlk seçenek olarak işten çıkarma, sponsor eskalasyonu veya tek taraflı karar."],["Paydaş ve iletişim","Paydaş kaydı kimleri, rollerini ve beklentilerini tanımlar. Güç/ilgi matrisi yüksek güç-yüksek ilgi grubunu yakından yönetmeyi; yüksek güç-düşük ilgi grubunu memnun tutmayı önerir. Katılım değerlendirme matrisi mevcut ve istenen katılımı karşılaştırır. İletişim planı kime, ne zaman, hangi kanaldan, hangi bilgilerin iletileceğini tanımlar. Etkileşimli iletişim toplantı, push e-posta, pull bilgi deposudur. İletişim kanalı sayısı n(n-1)/2.","Yeni bir düzenleyici paydaş katıldığında beklentileri ve yetkisi analiz edilir; paydaş kaydı ve iletişim/katılım planları uyarlanır.","Direnç → nedenini öğren; yanlış anlaşılma → etkileşimli görüşme; çok sayıda kişi → iletişim kanalları formülü.","Herkese aynı raporu göndermek, paydaşları yalnızca başlangıçta değerlendirmek."],["Maliyet ve EVM","PV planlanan işin bütçelenmiş değeri; EV tamamlanan işin bütçelenmiş değeri; AC gerçekleşen maliyettir. CV=EV−AC, SV=EV−PV; negatif değer olumsuzdur. CPI=EV/AC, SPI=EV/PV; 1 altı olumsuzdur. BAC toplam bütçe, EAC tamamlanma tahmini, ETC kalan maliyet, VAC=BAC−EAC. Mevcut maliyet performansı sürecekse EAC=BAC/CPI; geçmiş sapma tek seferlikse EAC=AC+(BAC−EV).","BAC=1000, EV=400, AC=500, PV=450. CPI=0,8; SPI≈0,89; CV=−100; SV=−50. Mevcut maliyet performansı sürerse EAC=1250.","CPI düşük → bütçe aşımı; SPI düşük → takvim gerisi; EAC → toplam tahmin; ETC → kalan maliyet.","EV ile AC'yi ters bölmek, SV'yi doğrudan gün sayısı sanmak, her durumda aynı EAC formülünü kullanmak."],["Kalite yönetimi","Kalite planlama standartları ve ölçütleri belirler. Kalite yönetimi süreçlerin uygunluğunu ve iyileştirilmesini, kalite kontrol teslimatların ölçüm ve testini ele alır. Pareto öncelikli hata kategorilerini, Ishikawa olası nedenleri, kontrol grafiği süreç kararlılığını gösterir. Kontrol limitleri süreç davranışını, spesifikasyon limitleri müşteri gereksinimlerini temsil eder. Önleme maliyeti ve değerlendirme maliyeti uygunluk maliyetidir; iç/dış hata maliyetleri uygunsuzluk maliyetidir.","Aynı hata tekrar ediyorsa yalnızca düzeltme değil, 5 Neden veya balık kılçığıyla kök neden analizi yap ve süreci iyileştir.","Kök neden → Ishikawa/5 Neden; en sık hata → Pareto; süreç kararlılığı → kontrol grafiği; kabul → kapsam doğrulama.","Kaliteyi yalnızca final testine bırakmak, müşteri kabulü ile teknik doğrulamayı karıştırmak."],["Tedarik ve sözleşmeler","Yap veya satın al analizi iç kaynak ve dış kaynak seçeneklerini karşılaştırır. Sabit fiyat sözleşmesinde kapsam net olmalıdır; maliyet artışı riski genellikle satıcıdadır. Maliyet geri ödemeli sözleşmede alıcının maliyet riski daha yüksektir. Zaman ve malzeme sözleşmesinde birim fiyatlar belirlenir fakat toplam iş belirsiz olabilir. Tedarik kontrolü performans, değişiklik, hak talepleri ve sözleşme şartlarını izler.","Satıcı ek ücret istediğinde önce sözleşme ve değişiklik hükümlerini incele, gerekirse yetkili satın alma/hukuk ekibiyle değerlendir.","Net kapsam → sabit fiyat; belirsiz araştırma → maliyet geri ödemeli değerlendir; birim ücret → zaman ve malzeme.","Sözleşme dışı talebi sözlü onaylamak, proje yöneticisinin her sözleşme kararına yetkili olduğunu varsaymak."],["İş değeri ve faydalar","İş gerekçesi yatırımın nedenini ve ekonomik/stratejik değerini açıklar. Fayda yönetimi planı beklenen faydaları, ölçütleri, zamanlamayı ve sahipleri tanımlar. Çıktı üretilen ürün, sonuç kullanımın yarattığı değişim, fayda ölçülebilir değerdir. MVP varsayımları en az uygulanabilir ürünle test eder. Değer teslimatı sadece proje sonunda değil, yaşam döngüsü boyunca izlenebilir.","Yeni uygulama teslim edildi ancak kullanım düşük. Teslimatın tamamlanması tek başına faydanın gerçekleştiği anlamına gelmez; benimsenme ve iş sonuçları ölçülmelidir.","Stratejik uyum bozuldu → iş gerekçesini değerlendir; erken öğrenme → MVP; fayda sahibi → operasyon/iş birimi.","Bütçede biten her projeyi otomatik başarılı saymak."],["Takvim ve kaynak","Kritik yol en uzun süreli bağımlılık yoludur ve en erken proje bitişini belirler. Toplam bolluk bir faaliyetin proje bitişini geciktirmeden kayabileceği süredir. FS bitiş-başlangıç, SS başlangıç-başlangıç, FF bitiş-bitiş, SF başlangıç-bitiştir. Crashing ek kaynakla süreyi kısaltır ve maliyeti artırabilir; fast tracking işleri örtüştürür ve yeniden iş riskini artırır. Kaynak dengeleme kritik yolu değiştirebilir. PERT=(iyimser+4×en olası+kötümser)/6.","İki yol A-B=8 gün, C-D=11 gün ise kritik yol C-D'dir. Kritik olmayan işi kısaltmak proje bitişini değiştirmeyebilir.","Ek kaynak → crashing; paralelleştirme → fast tracking; üç nokta ağırlıklı tahmin → PERT.","En çok faaliyet içeren yolu kritik sanmak; kaynak dengelemenin süreyi asla değiştirmediğini düşünmek."],["Öğrenme ve retrospektif","Öğrenilen dersler proje boyunca kaydedilir; yalnızca kapanışta hazırlanmaz. Retrospektif ekip çalışma biçimini inceler, uygulanabilir iyileştirme aksiyonları üretir. Review ürün artımını paydaşlarla inceler. Bilgi yönetiminde açık bilgi dokümante edilebilir; örtük bilgi deneyim ve etkileşimle aktarılır. Kapanışta kabul, devir, arşiv, sözleşme kapanışı ve kaynakların serbest bırakılması ele alınır.","Her sprintte test darboğazı yaşanıyor. Retrospektifte nedenleri tartış, küçük bir iyileştirme deneyi seç, sonraki sprintte etkisini ölç.","Süreç → retro; ürün → review; deneyim aktarımı → mentorluk; kapanış → resmi devir ve arşiv.","Retrospektifi suçlama toplantısına dönüştürmek veya dersleri sadece sona bırakmak."],["Yönetişim, etik ve uyum","Yönetişim karar yetkilerini, hesap verebilirliği ve kontrol mekanizmalarını tanımlar. Uyum gereksinimleri belirlenmeli, izlenmeli ve kanıtlanmalıdır. PMI etik ilkeleri sorumluluk, saygı, adalet ve dürüstlüktür. Çıkar çatışmaları açıklanır; yanlış raporlama kabul edilmez. Güvenlik veya mevzuat ihlali varsa zarar önlenir ve yetkili kanallara uygun bildirim yapılır.","Yönetici gecikmeyi gizlemeni isterse gerçek veriyi raporla, uygun etik ve yönetişim sürecini izle.","Yetki dışı karar → eskalasyon; mevzuat ihlali → uygun bildirim ve düzeltme; çıkar çatışması → açıklama.","Her durumda önce uzun analiz yapmak; acil güvenlik tehdidinde gecikmek; etik ihlali örtbas etmek."],["AI ve sürdürülebilirlik","Yapay zekâ tahmin, özetleme ve risk tespitini destekleyebilir; karar sorumluluğu insanda kalır. Veri gizliliği, güvenlik, doğruluk, önyargı ve izlenebilirlik değerlendirilmelidir. Sürdürülebilirlik çevresel, sosyal ve ekonomik etkileri yaşam döngüsü boyunca ele alır. Alternatifler yalnızca kısa vadeli maliyetle değil uzun vadeli değer ve riskle değerlendirilir.","AI risk raporu oluşturduğunda kaynak verileri doğrula, hassas verinin işlenmesine izin olup olmadığını kontrol et, uzman değerlendirmesiyle sonuçları kullan.","AI önerisi → insan doğrulaması; hassas veri → politika ve yetki; sürdürülebilirlik → yaşam döngüsü etkisi.","AI çıktısını otomatik gerçek kabul etmek veya sürdürülebilirliği yalnızca çevre maliyetine indirgemek."],["Hibrit ve yaklaşım seçimi","Öngörücü yaklaşım kapsam ve gereksinimler istikrarlı olduğunda ayrıntılı ön planlama sağlar. Çevik yaklaşım değişken ihtiyaçlarda kısa geri bildirim ve artımlı değer sağlar. Yinelemeli yaklaşım çözümü tekrarlarla geliştirir; artımlı yaklaşım parçalar halinde teslim eder. Hibrit yaklaşım farklı bileşenlerde uygun yöntemleri birleştirir. Tailoring proje bağlamına göre süreç ve uygulamaları uyarlamaktır.","Donanım tedariki sabit şartlara bağlı, yazılım ihtiyaçları değişken ise donanım için öngörücü, yazılım için çevik uygulamalar seçilebilir; ortak bağımlılıklar ve yönetişim planlanır.","Belirsizlik yüksek → çevik değerlendir; sabit düzenleyici teslimatlar → öngörücü değerlendir; karma koşullar → hibrit; bağlama uyarlama → tailoring.","Her projeye aynı yöntemi zorlamak veya çevikte planlama olmadığını sanmak."]];let S=JSON.parse(localStorage.getItem('pmp-v1')||'{}');S.done??=[];S.answers??={};S.daily??={};S.goal??=80;const save=()=>localStorage.setItem('pmp-v1',JSON.stringify(S));const v=document.querySelector('#view');const today=()=>new Date().toLoca
