<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#173b46"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><title>PMP Atölyesi</title><style>*{box-sizing:border-box}body{margin:0;background:#edf4f2;color:#173b46;font:16px system-ui}header{background:#173b46;color:white;padding:24px}main{max-width:760px;margin:auto;padding:16px}section,article{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #173b4610}button,input,select{font:inherit;padding:12px;border-radius:10px;border:1px solid #b8cfca}button{background:#176b60;color:white;border:0;cursor:pointer;margin:4px}nav{display:flex;flex-wrap:wrap}nav button{flex:1}h1,h2,h3{margin:8px 0}small{color:#52716d}progress{width:100%;accent-color:#176b60}label{display:block;margin:10px 0}.option{display:block;width:100%;text-align:left;background:#e8f3ef;color:#173b46}.wrong{color:#a32d25}.right{color:#176b60}</style><header><small style="color:#bce6d9">KİŞİSEL SINAV HAZIRLIĞI</small><h1>PMP Atölyesi</h1>Türkçe çalışma rehberin</header><main><nav id="nav"></nav><div id="view"></div><small>Bağımsız eğitim uygulaması. Sorular özgündür; resmi PMI soruları değildir. Başarı yüzdesi resmi geçme puanı değildir.</small></main><script>
const D=[["Risk ve sorun","Risk belirsiz bir olaydır; gerçekleştiğinde sorun kaydına alınır. Risk sahibi, yanıt ve tetikleyiciler belirlenir.","Bir risk gerçekleşti. İlk uygun işlem?","Sorunu kaydet ve yanıt planını değerlendir","Risk kaydını sil","Projeyi durdur","Sponsorun çözmesini bekle"],["Değişiklik yönetimi","Geleneksel projede temel çizgiyi etkileyen değişiklik için etki analizi ve yetkili onayı gerekir. Çevikte ürün iş listesi önceliklendirilir.","Müşteri kapsamı genişletmek istiyor. Geleneksel projede ne yaparsın?","Talebi kaydet ve etkisini analiz et","Hemen uygula","Talebi reddet","Ekibi değiştir"],["Çevik yaklaşım","Ürün sahibi değeri ve ürün iş listesini yönetir. Ekip işi organize eder. Scrum Master engellerin kaldırılmasını kolaylaştırır.","Sprint sırasında ekip bir engelle karşılaştı. Scrum Master ne yapmalı?","Engelin kaldırılmasını kolaylaştırmalı","Ekibe görev atamalı","Sprinti otomatik iptal etmeli","Ürün iş listesini tek başına değiştirmeli"],["Çatışma yönetimi","İş birliği ve problem çözme kalıcı çözümler üretir. Önce tarafları dinle ve kök nedeni anla.","İki ekip üyesi teknik çözümde anlaşamıyor. İlk adım?","Tarafları dinleyip ortak çözüm aramak","Birini ekipten çıkarmak","Sponsora şikayet etmek","Çatışmayı yok saymak"],["Paydaş yönetimi","Paydaşları belirle, güç ve ilgilerini analiz et, katılım stratejisini güncelle.","Yeni güçlü bir paydaş projeye katıldı. Ne yapmalısın?","Beklentilerini analiz edip katılım planını güncelle","Tüm raporları otomatik gönder","Kapsamı hemen değiştir","Proje kapanışını bekle"],["Kazanılmış değer","EV kazanılmış değer, PV planlanan değer, AC gerçekleşen maliyet. CPI=EV/AC, SPI=EV/PV. 1 altı olumsuzdur.","EV=80, AC=100, PV=90. CPI nedir?","0,8","1,25","0,9","1,125"],["Kalite","Kalite yönetimi süreçleri iyileştirir; kalite kontrol çıktıları inceler. Kök neden analizi tekrarları önler.","Aynı hata sürekli oluşuyor. Ne yapmalısın?","Kök neden analizi yap","Her hatayı gizle","Kontrolü kaldır","Teslimatı koşulsuz kabul et"],["Tedarik","Sabit fiyat sözleşmesinde maliyet aşımı riski genellikle satıcıda daha fazladır. Sözleşme değişiklikleri yetkili süreçle yürütülür.","Satıcı sözleşme dışı ek ücret istiyor. İlk adım?","Sözleşme şartlarını incele","Hemen ödeme yap","Sözleşmeyi feshet","Talebi yok say"],["İş değeri","Proje çıktısı ile iş sonucu farklıdır. Fayda gerçekleşmesi ve stratejik uyum izlenir.","Projenin beklenen faydası azaldı. Ne yapmalısın?","İş gerekçesini ve faydaları paydaşlarla değerlendir","Sırf plan var diye devam et","Tüm ekibi değiştir","Raporlamayı durdur"],["Zaman yönetimi","Kritik yol proje süresini belirleyen en uzun süreli bağımlılık yoludur. Crashing kaynak ekler, fast tracking işleri örtüştürür.","Bağımlı işleri kısmen paralel yürütmek hangi tekniktir?","Fast tracking","Crashing","Tesviye","Monte Carlo"],["Retrospektif","Sprint retrospektifi çalışma biçimini iyileştirir. Sprint review ürün çıktısını ve geri bildirimi ele alır.","Ekip çalışma sürecini iyileştirmek istiyor. Hangi etkinlik?","Retrospektif","Sprint review","Daily Scrum","Proje başlatma"],["Yönetişim ve etik","Mevzuat, güvenlik ve etik ihlalleri uygun kanallarla ele alınır. Bilgiler doğru raporlanır.","Yönetici olumsuz proje verisini gizlemeni istiyor. Ne yaparsın?","Doğru raporla ve uygun etik süreci izle","Veriyi değiştir","Raporu sil","Talebi kabul et"],["Yapay zekâ ve sürdürülebilirlik","AI çıktıları doğrulanmalı, gizlilik ve önyargı riskleri yönetilmelidir. Sürdürülebilirlik kararlarında uzun vadeli etkiler değerlendirilir.","AI aracı gizli müşteri verisi istiyor. Ne yaparsın?","Veri politikalarını ve güvenlik risklerini değerlendir","Veriyi doğrudan yükle","Çıktıyı doğrulamadan kullan","Gizlilik kurallarını kaldır"],["Hibrit yönetim","Öngörücü ve çevik uygulamalar proje ihtiyacına göre birleştirilir. Yönetişim ve ekip geri bildirimleri birlikte yönetilir.","Donanım kapsamı sabit, yazılım ihtiyaçları değişken. Uygun yaklaşım?","Hibrit","Her durumda şelale","Planlamasız çalışma","Her durumda Scrum"]];let S=JSON.parse(localStorage.getItem('pmp-v1')||'{}');S.done??=[];S.answers??={};S.daily??={};S.goal??=80;const save=()=>localStorage.setItem('pmp-v1',JSON.stringify(S));const v=document.querySelector('#view');const today=()=>new Date().toLocaleDateString('sv-SE');const days=()=>S.date?Math.max(0,Math.round((new Date(S.date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)):null;let tab=0;const tabs=['Ana sayfa','Takvim','Konular','Hap bilgiler','Test','Yanlışlar'];document.querySelector('#nav').innerHTML=tabs.map((t,i)=>'<button onclick="show('+i+')">'+t+'</button>').join('');function stats(){let a=Object.values(S.answers);return a.length?Math.round(a.filter(Boolean).length/a.length*100):0}function show(i){tab=i;let n=days();if(i===0){v.innerHTML='<section><h2>'+(n===null?'Sınav tarihini belirle':n+' gün kaldı')+'</h2><label>Sınav tarihi <input type="date" id="date"></label><label>Hedef başarı (%) <input type="number" min="1" max="100" id="goal"></label><button onclick="settings()">Kaydet</button></section><section><h2>İlerleme</h2>Konu: '+S.done.length+'/'+D.length+'<progress max="'+D.length+'" value="'+S.done.length+'"></progress>Test başarısı: %'+stats()+' · Hedef: %'+S.goal+'<progress max="100" value="'+stats()+'"></progress><button onclick="start(false,10)">Seviye testi</button></section>';document.querySelector('#date').value=S.date||'';document.querySelector('#goal').value=S.goal;}if(i===1){let count=Math.min(365,Math.max(1,n??14)),base=new Date(today()+'T12:00:00');v.innerHTML='<h2>Çalışma takvimi</h2>'+Array.from({length:count},(_,j)=>{let d=new Date(base);d.setDate(d.getDate()+j);let key=d.toLocaleDateString('sv-SE'),idx=j%D.length;return '<article><b>'+d.toLocaleDateString('tr-TR')+'</b><p>'+D[idx][0]+' · 10 dk tekrar · soru çözümü</p><label><input type="checkbox" '+(S.daily[key]?'checked':'')+' onchange="S.daily[\''+key+'\']=this.checked;save()"> Gün tamamlandı</label><button onclick="lesson('+idx+')">Konuya git</button></article>'}).join('')}if(i===2)v.innerHTML='<h2>Konular</h2>'+D.map((d,j)=>'<article><b>'+d[0]+'</b> '+(S.done.includes(j)?'✓':'')+'<button onclick="lesson('+j+')">Çalış</button></article>').join('');if(i===3)v.innerHTML='<h2>Hap bilgiler</h2>'+D.map(d=>'<article><b>'+d[0]+'</b><details><summary>Bilgiyi göster</summary><p>'+d[1]+'</p></details></article>').join('');if(i===4)v.innerHTML='<section><h2>Özgün soru bankası</h2><p>'+D.length+' açıklamalı soru</p><button onclick="start(false,10)">10 soruluk mini test</button><button onclick="start(false,99)">Tüm sorular</button></section>';if(i===5)v.innerHTML='<section><h2>Yanlışlarım</h2><p>'+Object.values(S.answers).filter(x=>!x).length+' tekrar edilecek soru</p><button onclick="start(true,99)">Yanlışları çöz</button></section>'}function settings(){S.date=document.querySelector('#date').value;S.goal=Math.max(1,Math.min(100,Number(document.querySelector('#goal').value)||80));save();show(0)}function lesson(j){v.innerHTML='<article><h2>'+D[j][0]+'</h2><p>'+D[j][1]+'</p><button onclick="if(!S.done.includes('+j+'))S.done.push('+j+');save();show(2)">Tamamlandı</button><button onclick="show(2)">Geri</button></article>'}let Q=[],pos=0,correct=0,locked=false;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(w,n){Q=shuffle(D.map((_,i)=>i).filter(i=>!w||S.answers[i]===false)).slice(0,n);pos=0;correct=0;question()}function question(){locked=false;if(pos>=Q.length){v.innerHTML='<section><h2>'+(Q.length?'Test tamamlandı':'Tekrar edilecek soru yok')+'</h2><p>'+correct+'/'+Q.length+' doğru</p><button onclick="show(0)">Ana sayfa</button></section>';return}let d=D[Q[pos]];v.innerHTML='<section><small>Soru '+(pos+1)+' / '+Q.length+'</small><h3>'+d[2]+'</h3>'+shuffle([3,4,5,6]).map(k=>'<button class="option" onclick="answer('+k+')">'+d[k]+'</button>').join('')+'<div id="feedback"></div></section>'}function answer(k){if(locked)return;locked=true;let ok=k===3;S.answers[Q[pos]]=ok;correct+=Number(ok);save();document.querySelector('#feedback').innerHTML='<p class="'+(ok?'right':'wrong')+'">'+(ok?'Doğru!':'Doğru cevap: '+D[Q[pos]][3])+'</p><p>'+D[Q[pos]][1]+'</p><button onclick="pos++;question()">Devam</button>'}show(0);if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></html>
