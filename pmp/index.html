const D=[["Risk ve sorun","Risk belirsiz bir olaydır; gerçekleştiğinde sorun kaydına alınır. Risk sahibi, yanıt ve tetikleyiciler belirlenir.","Bir risk gerçekleşti. İlk uygun işlem?","Sorunu kaydet ve yanıt planını değerlendir","Risk kaydını sil","Projeyi durdur","Sponsorun çözmesini bekle"],["Değişiklik yönetimi","Geleneksel projede temel çizgiyi etkileyen değişiklik için etki analizi ve yetkili onayı gerekir. Çevikte ürün iş listesi önceliklendirilir.","Müşteri kapsamı genişletmek istiyor. Geleneksel projede ne yaparsın?","Talebi kaydet ve etkisini analiz et","Hemen uygula","Talebi reddet","Ekibi değiştir"],["Çevik yaklaşım","Ürün sahibi değeri ve ürün iş listesini yönetir. Ekip işi organize eder. Scrum Master engellerin kaldırılmasını kolaylaştırır.","Sprint sırasında ekip bir engelle karşılaştı. Scrum Master ne yapmalı?","Engelin kaldırılmasını kolaylaştırmalı","Ekibe görev atamalı","Sprinti otomatik iptal etmeli","Ürün iş listesini tek başına değiştirmeli"],["Çatışma yönetimi","İş birliği ve problem çözme kalıcı çözümler üretir. Önce tarafları dinle ve kök nedeni anla.","İki ekip üyesi teknik çözümde anlaşamıyor. İlk adım?","Tarafları dinleyip ortak çözüm aramak","Birini ekipten çıkarmak","Sponsora şikayet etmek","Çatışmayı yok saymak"],["Paydaş yönetimi","Paydaşları belirle, güç ve ilgilerini analiz et, katılım stratejisini güncelle.","Yeni güçlü bir paydaş projeye katıldı. Ne yapmalısın?","Beklentilerini analiz edip katılım planını güncelle","Tüm raporları otomatik gönder","Kapsamı hemen değiştir","Proje kapanışını bekle"],["Kazanılmış değer","EV kazanılmış değer, PV planlanan değer, AC gerçekleşen maliyet. CPI=EV/AC, SPI=EV/PV. 1 altı olumsuzdur.","EV=80, AC=100, PV=90. CPI nedir?","0,8","1,25","0,9","1,125"],["Kalite","Kalite yönetimi süreçleri iyileştirir; kalite kontrol çıktıları inceler. Kök neden analizi tekrarları önler.","Aynı hata sürekli oluşuyor. Ne yapmalısın?","Kök neden analizi yap","Her hatayı gizle","Kontrolü kaldır","Teslimatı koşulsuz kabul et"],["Tedarik","Sabit fiyat sözleşmesinde maliyet aşımı riski genellikle satıcıda daha fazladır. Sözleşme değişiklikleri yetkili süreçle yürütülür.","Satıcı sözleşme dışı ek ücret istiyor. İlk adım?","Sözleşme şartlarını incele","Hemen ödeme yap","Sözleşmeyi feshet","Talebi yok say"],["İş değeri","Proje çıktısı ile iş sonucu farklıdır. Fayda gerçekleşmesi ve stratejik uyum izlenir.","Projenin beklenen faydası azaldı. Ne yapmalısın?","İş gerekçesini ve faydaları paydaşlarla değerlendir","Sırf plan var diye devam et","Tüm ekibi değiştir","Raporlamayı durdur"],["Zaman yönetimi","Kritik yol proje süresini belirleyen en uzun süreli bağımlılık yoludur. Crashing kaynak ekler, fast tracking işleri örtüştürür.","Bağımlı işleri kısmen paralel yürütmek hangi tekniktir?","Fast tracking","Crashing","Tesviye","Monte Carlo"],["Retrospektif","Sprint retrospektifi çalışma biçimini iyileştirir. Sprint review ürün çıktısını ve geri bildirimi ele alır.","Ekip çalışma sürecini iyileştirmek istiyor. Hangi etkinlik?","Retrospektif","Sprint review","Daily Scrum","Proje başlatma"],["Yönetişim ve etik","Mevzuat, güvenlik ve etik ihlalleri uygun kanallarla ele alınır. Bilgiler doğru raporlanır.","Yönetici olumsuz proje verisini gizlemeni istiyor. Ne yaparsın?","Doğru raporla ve uygun etik süreci izle","Veriyi değiştir","Raporu sil","Talebi kabul et"],["Yapay zekâ ve sürdürülebilirlik","AI çıktıları doğrulanmalı, gizlilik ve önyargı riskleri yönetilmelidir. Sürdürülebilirlik kararlarında uzun vadeli etkiler değerlendirilir.","AI aracı gizli müşteri verisi istiyor. Ne yaparsın?","Veri politikalarını ve güvenlik risklerini değerlendir","Veriyi doğrudan yükle","Çıktıyı doğrulamadan kullan","Gizlilik kurallarını kaldır"],["Hibrit yönetim","Öngörücü ve çevik uygulamalar proje ihtiyacına göre birleştirilir. Yönetişim ve ekip geri bildirimleri birlikte yönetilir.","Donanım kapsamı sabit, yazılım ihtiyaçları değişken. Uygun yaklaşım?","Hibrit","Her durumda şelale","Planlamasız çalışma","Her durumda Scrum"],["Risk yönetimi","Risk henüz gerçekleşmemiş, belirsiz bir olaydır; olumlu (fırsat) veya olumsuz (tehdit) olabilir. Risk yönetimi planı yöntemleri belirler; risk kaydı tekil riskleri, sahiplerini, tetikleyicilerini ve yanıtlarını içerir. Nitel analiz olasılık ve etkiye göre önceliklendirir; nicel analiz sayısal etkileri tahmin eder. Tehdit yanıtları kaçınma, azaltma, transfer, kabul ve eskalasyondur. Fırsat yanıtları yararlanma, geliştirme, paylaşma, kabul ve eskalasyondur. Artık risk yanıt sonrasında kalan, ikincil risk ise yanıtın doğurduğu yeni risktir. Belirlenmiş riskler için beklenmedik durum rezervi, bilinmeyen belirsizlikler için yönetim rezervi kullanılabilir.","Bir risk yanıtı yeni bir güvenlik açığı doğurdu. Bu nedir?","İkincil risk","Artık risk","Sorun rezervi","Fırsat"],["Risk yönetimi","Risk henüz gerçekleşmemiş, belirsiz bir olaydır; olumlu (fırsat) veya olumsuz (tehdit) olabilir. Risk yönetimi planı yöntemleri belirler; risk kaydı tekil riskleri, sahiplerini, tetikleyicilerini ve yanıtlarını içerir. Nitel analiz olasılık ve etkiye göre önceliklendirir; nicel analiz sayısal etkileri tahmin eder. Tehdit yanıtları kaçınma, azaltma, transfer, kabul ve eskalasyondur. Fırsat yanıtları yararlanma, geliştirme, paylaşma, kabul ve eskalasyondur. Artık risk yanıt sonrasında kalan, ikincil risk ise yanıtın doğurduğu yeni risktir. Belirlenmiş riskler için beklenmedik durum rezervi, bilinmeyen belirsizlikler için yönetim rezervi kullanılabilir.","Bir tehdidin mali etkisini sigorta şirketine aktarmak?","Transfer","Kaçınma","Azaltma","Kabul"],["Değişiklik ve kapsam","Proje başlatma belgesi projeyi yetkilendirir; kapsam temel çizgisi kapsam bildirimi, iş kırılım yapısı (WBS) ve WBS sözlüğünden oluşur. Gereksinim izlenebilirlik matrisi ihtiyaçları teslimat ve testlerle ilişkilendirir. Öngörücü projede değişiklik talebi kaydedilir, zaman/maliyet/kapsam/kalite/risk etkileri analiz edilir, yetkili merci karar verir; onay sonrası plan ve temel çizgiler güncellenir. Çevikte yeni ihtiyaç ürün iş listesine alınır ve ürün sahibi önceliklendirir. Kapsam doğrulama müşteri kabulü, kalite kontrol teknik uygunlukla ilgilidir.","Müşteri teknik olarak doğrulanmış teslimatı resmi olarak kabul ediyor. Hangi süreç?","Kapsam doğrulama","Kalite kontrol","Risk analizi","Kaynak dengeleme"],["Değişiklik ve kapsam","Proje başlatma belgesi projeyi yetkilendirir; kapsam temel çizgisi kapsam bildirimi, iş kırılım yapısı (WBS) ve WBS sözlüğünden oluşur. Gereksinim izlenebilirlik matrisi ihtiyaçları teslimat ve testlerle ilişkilendirir. Öngörücü projede değişiklik talebi kaydedilir, zaman/maliyet/kapsam/kalite/risk etkileri analiz edilir, yetkili merci karar verir; onay sonrası plan ve temel çizgiler güncellenir. Çevikte yeni ihtiyaç ürün iş listesine alınır ve ürün sahibi önceliklendirir. Kapsam doğrulama müşteri kabulü, kalite kontrol teknik uygunlukla ilgilidir.","Onaylı kapsam dışına ekip kendi isteğiyle özellik ekliyor. Bu nedir?","Altın kaplama","Kapsam doğrulama","Kritik yol","Fayda analizi"],["Çevik ve Scrum","Çevik yaklaşım belirsiz gereksinimlerde kısa geri bildirim döngüleriyle değer üretir. Scrum ürün sahibi (Product Owner) ürün değerini ve backlog yönetimini üstlenir; geliştiriciler sprint planını oluşturur ve işi kendileri yönetir; Scrum Master etkinliği destekler ve engellerin kaldırılmasını kolaylaştırır. Sprint Planning hedef ve plan, Daily Scrum geliştiricilerin ilerlemeyi uyarlaması, Review ürün ve paydaş geri bildirimi, Retrospective süreç iyileştirmesidir. Definition of Done ortak kalite ölçütüdür. Kanban akışı görselleştirir, devam eden işi (WIP) sınırlar. Hız (velocity) ekip içi tahmin aracıdır, ekipler arası performans sıralaması değildir.","Ürün iş listesinin sırasından kim hesap verebilir?","Ürün sahibi","Scrum Master","Sponsor","Tedarikçi"],["Çevik ve Scrum","Çevik yaklaşım belirsiz gereksinimlerde kısa geri bildirim döngüleriyle değer üretir. Scrum ürün sahibi (Product Owner) ürün değerini ve backlog yönetimini üstlenir; geliştiriciler sprint planını oluşturur ve işi kendileri yönetir; Scrum Master etkinliği destekler ve engellerin kaldırılmasını kolaylaştırır. Sprint Planning hedef ve plan, Daily Scrum geliştiricilerin ilerlemeyi uyarlaması, Review ürün ve paydaş geri bildirimi, Retrospective süreç iyileştirmesidir. Definition of Done ortak kalite ölçütüdür. Kanban akışı görselleştirir, devam eden işi (WIP) sınırlar. Hız (velocity) ekip içi tahmin aracıdır, ekipler arası performans sıralaması değildir.","Kanban ekibinde çok fazla yarım iş var. Ne yapılmalı?","WIP sınırlarıyla akışı iyileştir","Yeni işleri artır","Tüm işleri eşzamanlı başlat","Hızı bireysel puanla ölç"],["Liderlik ve çatışma","Hizmetkâr liderlik ekibi güçlendirir, engelleri kaldırır ve karar almayı destekler. Çatışma yöntemleri iş birliği/problem çözme, uzlaşma, yumuşatma, zorlama ve geri çekilmedir. İş birliği çoğu kalıcı çözüm için uygundur; acil güvenlik durumunda doğrudan müdahale gerekebilir. Duygusal zekâ öz farkındalık, öz yönetim, empati ve ilişki yönetimini içerir. Ekip sözleşmesi çalışma normlarını belirler. Tuckman modeli oluşum, çatışma, normlaşma, performans ve dağılmadır.","Ekip üyesinin yeni teknoloji bilgisi eksik. İlk uygun yaklaşım?","Eğitim ve koçluk ihtiyacını değerlendir","Üyeyi hemen değiştir","Sorunu gizle","Görevleri iptal et"],["Paydaş ve iletişim","Paydaş kaydı kimleri, rollerini ve beklentilerini tanımlar. Güç/ilgi matrisi yüksek güç-yüksek ilgi grubunu yakından yönetmeyi; yüksek güç-düşük ilgi grubunu memnun tutmayı önerir. Katılım değerlendirme matrisi mevcut ve istenen katılımı karşılaştırır. İletişim planı kime, ne zaman, hangi kanaldan, hangi bilgilerin iletileceğini tanımlar. Etkileşimli iletişim toplantı, push e-posta, pull bilgi deposudur. İletişim kanalı sayısı n(n-1)/2.","8 kişilik ekipte potansiyel iletişim kanalı sayısı?","28","16","56","8"],["Maliyet ve EVM","PV planlanan işin bütçelenmiş değeri; EV tamamlanan işin bütçelenmiş değeri; AC gerçekleşen maliyettir. CV=EV−AC, SV=EV−PV; negatif değer olumsuzdur. CPI=EV/AC, SPI=EV/PV; 1 altı olumsuzdur. BAC toplam bütçe, EAC tamamlanma tahmini, ETC kalan maliyet, VAC=BAC−EAC. Mevcut maliyet performansı sürecekse EAC=BAC/CPI; geçmiş sapma tek seferlikse EAC=AC+(BAC−EV).","EV=120, PV=150, AC=100. SPI nedir?","0,8","1,2","1,5","0,67"],["Maliyet ve EVM","PV planlanan işin bütçelenmiş değeri; EV tamamlanan işin bütçelenmiş değeri; AC gerçekleşen maliyettir. CV=EV−AC, SV=EV−PV; negatif değer olumsuzdur. CPI=EV/AC, SPI=EV/PV; 1 altı olumsuzdur. BAC toplam bütçe, EAC tamamlanma tahmini, ETC kalan maliyet, VAC=BAC−EAC. Mevcut maliyet performansı sürecekse EAC=BAC/CPI; geçmiş sapma tek seferlikse EAC=AC+(BAC−EV).","BAC=500, CPI=0,8 ve performans sürecek. EAC?","625","400","500","125"],["Kalite yönetimi","Kalite planlama standartları ve ölçütleri belirler. Kalite yönetimi süreçlerin uygunluğunu ve iyileştirilmesini, kalite kontrol teslimatların ölçüm ve testini ele alır. Pareto öncelikli hata kategorilerini, Ishikawa olası nedenleri, kontrol grafiği süreç kararlılığını gösterir. Kontrol limitleri süreç davranışını, spesifikasyon limitleri müşteri gereksinimlerini temsil eder. Önleme maliyeti ve değerlendirme maliyeti uygunluk maliyetidir; iç/dış hata maliyetleri uygunsuzluk maliyetidir.","En fazla hata oluşturan kategorileri önceliklendirmek için?","Pareto grafiği","Gantt grafiği","Paydaş matrisi","WBS"],["Tedarik ve sözleşmeler","Yap veya satın al analizi iç kaynak ve dış kaynak seçeneklerini karşılaştırır. Sabit fiyat sözleşmesinde kapsam net olmalıdır; maliyet artışı riski genellikle satıcıdadır. Maliyet geri ödemeli sözleşmede alıcının maliyet riski daha yüksektir. Zaman ve malzeme sözleşmesinde birim fiyatlar belirlenir fakat toplam iş belirsiz olabilir. Tedarik kontrolü performans, değişiklik, hak talepleri ve sözleşme şartlarını izler.","Kapsam net ve fiyat sabit. Maliyet aşımı riski genellikle kimde?","Satıcı","Alıcı","Scrum Master","Müşteri temsilcisi"],["İş değeri ve faydalar","İş gerekçesi yatırımın nedenini ve ekonomik/stratejik değerini açıklar. Fayda yönetimi planı beklenen faydaları, ölçütleri, zamanlamayı ve sahipleri tanımlar. Çıktı üretilen ürün, sonuç kullanımın yarattığı değişim, fayda ölçülebilir değerdir. MVP varsayımları en az uygulanabilir ürünle test eder. Değer teslimatı sadece proje sonunda değil, yaşam döngüsü boyunca izlenebilir.","Ürün teslim edildi ama beklenen tasarruf sağlanmadı. Ne incelenmeli?","Fayda gerçekleşmesi","Sadece teslim tarihi","Sadece ekip büyüklüğü","Sadece sözleşme numarası"],["Takvim ve kaynak","Kritik yol en uzun süreli bağımlılık yoludur ve en erken proje bitişini belirler. Toplam bolluk bir faaliyetin proje bitişini geciktirmeden kayabileceği süredir. FS bitiş-başlangıç, SS başlangıç-başlangıç, FF bitiş-bitiş, SF başlangıç-bitiştir. Crashing ek kaynakla süreyi kısaltır ve maliyeti artırabilir; fast tracking işleri örtüştürür ve yeniden iş riskini artırır. Kaynak dengeleme kritik yolu değiştirebilir. PERT=(iyimser+4×en olası+kötümser)/6.","İyimser 4, en olası 7, kötümser 16. PERT tahmini?","8","9","7","12"],["Takvim ve kaynak","Kritik yol en uzun süreli bağımlılık yoludur ve en erken proje bitişini belirler. Toplam bolluk bir faaliyetin proje bitişini geciktirmeden kayabileceği süredir. FS bitiş-başlangıç, SS başlangıç-başlangıç, FF bitiş-bitiş, SF başlangıç-bitiştir. Crashing ek kaynakla süreyi kısaltır ve maliyeti artırabilir; fast tracking işleri örtüştürür ve yeniden iş riskini artırır. Kaynak dengeleme kritik yolu değiştirebilir. PERT=(iyimser+4×en olası+kötümser)/6.","Kritik faaliyete ek kaynak eklenerek süre azaltılıyor. Nedir?","Crashing","Fast tracking","Risk transferi","Kapsam doğrulama"],["Öğrenme ve retrospektif","Öğrenilen dersler proje boyunca kaydedilir; yalnızca kapanışta hazırlanmaz. Retrospektif ekip çalışma biçimini inceler, uygulanabilir iyileştirme aksiyonları üretir. Review ürün artımını paydaşlarla inceler. Bilgi yönetiminde açık bilgi dokümante edilebilir; örtük bilgi deneyim ve etkileşimle aktarılır. Kapanışta kabul, devir, arşiv, sözleşme kapanışı ve kaynakların serbest bırakılması ele alınır.","Paydaşlar ürün artımını inceliyor. Hangi etkinlik?","Sprint review","Retrospektif","Daily Scrum","Sprint planning"],["Yönetişim, etik ve uyum","Yönetişim karar yetkilerini, hesap verebilirliği ve kontrol mekanizmalarını tanımlar. Uyum gereksinimleri belirlenmeli, izlenmeli ve kanıtlanmalıdır. PMI etik ilkeleri sorumluluk, saygı, adalet ve dürüstlüktür. Çıkar çatışmaları açıklanır; yanlış raporlama kabul edilmez. Güvenlik veya mevzuat ihlali varsa zarar önlenir ve yetkili kanallara uygun bildirim yapılır.","Tedarikçi seçiminde kişisel çıkar ilişkisi fark edildi. Ne yapılmalı?","Çıkar çatışmasını açıklayıp uygun süreci izle","Gizle","Teklifi otomatik onayla","Belgeleri sil"],["AI ve sürdürülebilirlik","Yapay zekâ tahmin, özetleme ve risk tespitini destekleyebilir; karar sorumluluğu insanda kalır. Veri gizliliği, güvenlik, doğruluk, önyargı ve izlenebilirlik değerlendirilmelidir. Sürdürülebilirlik çevresel, sosyal ve ekonomik etkileri yaşam döngüsü boyunca ele alır. Alternatifler yalnızca kısa vadeli maliyetle değil uzun vadeli değer ve riskle değerlendirilir.","AI tahmini proje kararını etkileyecek. Önce ne yapılmalı?","Veri ve tahmini doğrula","Otomatik uygula","Uzmanları dışla","Kaynakları sil"],["Hibrit ve yaklaşım seçimi","Öngörücü yaklaşım kapsam ve gereksinimler istikrarlı olduğunda ayrıntılı ön planlama sağlar. Çevik yaklaşım değişken ihtiyaçlarda kısa geri bildirim ve artımlı değer sağlar. Yinelemeli yaklaşım çözümü tekrarlarla geliştirir; artımlı yaklaşım parçalar halinde teslim eder. Hibrit yaklaşım farklı bileşenlerde uygun yöntemleri birleştirir. Tailoring proje bağlamına göre süreç ve uygulamaları uyarlamaktır.","Süreçleri projenin karmaşıklığına göre uyarlamak?","Tailoring","Crashing","Transfer","Gold plating"]];const L=[["Risk yönetimi","Risk henüz gerçekleşmemiş, belirsiz bir olaydır; olumlu (fırsat) veya olumsuz (tehdit) olabilir. Risk yönetimi planı yöntemleri belirler; risk kaydı tekil riskleri, sahiplerini, tetikleyicilerini ve yanıtlarını içerir. Nitel analiz olasılık ve etkiye göre önceliklendirir; nicel analiz sayısal etkileri tahmin eder. Tehdit yanıtları kaçınma, azaltma, transfer, kabul ve eskalasyondur. Fırsat yanıtları yararlanma, geliştirme, paylaşma, kabul ve eskalasyondur. Artık risk yanıt sonrasında kalan, ikincil risk ise yanıtın doğurduğu yeni risktir. Belirlenmiş riskler için beklenmedik durum rezervi, bilinmeyen belirsizlikler için yönetim rezervi kullanılabilir.","Bir entegrasyonun gecikme ihtimali risk kaydındadır. Gecikme gerçekleşince sorun kaydına alınır, önceden planlanan yanıt değerlendirilir, sorumlu ile aksiyon yürütülür ve etkiler izlenir.","Henüz olabilir → risk kaydı; gerçekleşti → sorun kaydı; olasılık/etki → nitel analiz; parasal dağılım → nicel analiz; sigorta → transfer; nedeni ortadan kaldırma → kaçınma.","Her riski sponsora taşımak, gerçekleşen riski yalnızca risk olarak izlemek, etkiyi değerlendirmeden temel çizgiyi değiştirmek."],["Değişiklik ve kapsam","Proje başlatma belgesi projeyi yetkilendirir; kapsam temel çizgisi kapsam bildirimi, iş kırılım yapısı (WBS) ve WBS sözlüğünden oluşur. Gereksinim izlenebilirlik matrisi ihtiyaçları teslimat ve testlerle ilişkilendirir. Öngörücü projede değişiklik talebi kaydedilir, zaman/maliyet/kapsam/kalite/risk etkileri analiz edilir, yetkili merci karar verir; onay sonrası plan ve temel çizgiler güncellenir. Çevikte yeni ihtiyaç ürün iş listesine alınır ve ürün sahibi önceliklendirir. Kapsam doğrulama müşteri kabulü, kalite kontrol teknik uygunlukla ilgilidir.","Müşteri onaylı ekrana yeni filtre ister. Önce ihtiyacı netleştir, etkiyi değerlendir, değişiklik sürecini uygula. Onaysız geliştirme kapsam kaymasına yol açabilir.","Onaylı temel çizgi → değişiklik kontrolü; müşteri kabulü → kapsam doğrulama; teknik test → kalite kontrol; izlenebilirlik → RTM.","Müşteri istedi diye hemen geliştirmek, tüm çevik değişiklikleri CCB'ye göndermek, altın kaplama yapmak."],["Çevik ve Scrum","Çevik yaklaşım belirsiz gereksinimlerde kısa geri bildirim döngüleriyle değer üretir. Scrum ürün sahibi (Product Owner) ürün değerini ve backlog yönetimini üstlenir; geliştiriciler sprint planını oluşturur ve işi kendileri yönetir; Scrum Master etkinliği destekler ve engellerin kaldırılmasını kolaylaştırır. Sprint Planning hedef ve plan, Daily Scrum geliştiricilerin ilerlemeyi uyarlaması, Review ürün ve paydaş geri bildirimi, Retrospective süreç iyileştirmesidir. Definition of Done ortak kalite ölçütüdür. Kanban akışı görselleştirir, devam eden işi (WIP) sınırlar. Hız (velocity) ekip içi tahmin aracıdır, ekipler arası performans sıralaması değildir.","Bir sprintte yeni istek gelirse ürün sahibi ile değerlendirilir; sprint hedefi korunur, kapsam geliştiricilerle müzakere edilebilir. Hedef geçersizleşirse sprinti iptal etme yetkisi ürün sahibindedir.","Ürün önceliği → PO; engel → Scrum Master; nasıl yapılacak → ekip; süreç iyileştirme → retrospektif; ürün geri bildirimi → review.","Daily Scrum'ı yöneticiye rapor toplantısı yapmak, ekibe görev dayatmak, hız metriklerini rekabet için kullanmak."],["Liderlik ve çatışma","Hizmetkâr liderlik ekibi güçlendirir, engelleri kaldırır ve karar almayı destekler. Çatışma yöntemleri iş birliği/problem çözme, uzlaşma, yumuşatma, zorlama ve geri çekilmedir. İş birliği çoğu kalıcı çözüm için uygundur; acil güvenlik durumunda doğrudan müdahale gerekebilir. Duygusal zekâ öz farkındalık, öz yönetim, empati ve ilişki yönetimini içerir. Ekip sözleşmesi çalışma normlarını belirler. Tuckman modeli oluşum, çatışma, normlaşma, performans ve dağılmadır.","İki uzman anlaşamıyor. Özel görüşme ve ortak oturumla nedenleri öğren, karar kriterlerini belirle, ekibin çözüm üretmesini destekle.","Çatışma → dinle ve kolaylaştır; beceri eksikliği → koçluk/eğitim; ekip normu → ekip sözleşmesi; yetki dışı engel → uygun eskalasyon.","İlk seçenek olarak işten çıkarma, sponsor eskalasyonu veya tek taraflı karar."],["Paydaş ve iletişim","Paydaş kaydı kimleri, rollerini ve beklentilerini tanımlar. Güç/ilgi matrisi yüksek güç-yüksek ilgi grubunu yakından yönetmeyi; yüksek güç-düşük ilgi grubunu memnun tutmayı önerir. Katılım değerlendirme matrisi mevcut ve istenen katılımı karşılaştırır. İletişim planı kime, ne zaman, hangi kanaldan, hangi bilgilerin iletileceğini tanımlar. Etkileşimli iletişim toplantı, push e-posta, pull bilgi deposudur. İletişim kanalı sayısı n(n-1)/2.","Yeni bir düzenleyici paydaş katıldığında beklentileri ve yetkisi analiz edilir; paydaş kaydı ve iletişim/katılım planları uyarlanır.","Direnç → nedenini öğren; yanlış anlaşılma → etkileşimli görüşme; çok sayıda kişi → iletişim kanalları formülü.","Herkese aynı raporu göndermek, paydaşları yalnızca başlangıçta değerlendirmek."],["Maliyet ve EVM","PV planlanan işin bütçelenmiş değeri; EV tamamlanan işin bütçelenmiş değeri; AC gerçekleşen maliyettir. CV=EV−AC, SV=EV−PV; negatif değer olumsuzdur. CPI=EV/AC, SPI=EV/PV; 1 altı olumsuzdur. BAC toplam bütçe, EAC tamamlanma tahmini, ETC kalan maliyet, VAC=BAC−EAC. Mevcut maliyet performansı sürecekse EAC=BAC/CPI; geçmiş sapma tek seferlikse EAC=AC+(BAC−EV).","BAC=1000, EV=400, AC=500, PV=450. CPI=0,8; SPI≈0,89; CV=−100; SV=−50. Mevcut maliyet performansı sürerse EAC=1250.","CPI düşük → bütçe aşımı; SPI düşük → takvim gerisi; EAC → toplam tahmin; ETC → kalan maliyet.","EV ile AC'yi ters bölmek, SV'yi doğrudan gün sayısı sanmak, her durumda aynı EAC formülünü kullanmak."],["Kalite yönetimi","Kalite planlama standartları ve ölçütleri belirler. Kalite yönetimi süreçlerin uygunluğunu ve iyileştirilmesini, kalite kontrol teslimatların ölçüm ve testini ele alır. Pareto öncelikli hata kategorilerini, Ishikawa olası nedenleri, kontrol grafiği süreç kararlılığını gösterir. Kontrol limitleri süreç davranışını, spesifikasyon limitleri müşteri gereksinimlerini temsil eder. Önleme maliyeti ve değerlendirme maliyeti uygunluk maliyetidir; iç/dış hata maliyetleri uygunsuzluk maliyetidir.","Aynı hata tekrar ediyorsa yalnızca düzeltme değil, 5 Neden veya balık kılçığıyla kök neden analizi yap ve süreci iyileştir.","Kök neden → Ishikawa/5 Neden; en sık hata → Pareto; süreç kararlılığı → kontrol grafiği; kabul → kapsam doğrulama.","Kaliteyi yalnızca final testine bırakmak, müşteri kabulü ile teknik doğrulamayı karıştırmak."],["Tedarik ve sözleşmeler","Yap veya satın al analizi iç kaynak ve dış kaynak seçeneklerini karşılaştırır. Sabit fiyat sözleşmesinde kapsam net olmalıdır; maliyet artışı riski genellikle satıcıdadır. Maliyet geri ödemeli sözleşmede alıcının maliyet riski daha yüksektir. Zaman ve malzeme sözleşmesinde birim fiyatlar belirlenir fakat toplam iş belirsiz olabilir. Tedarik kontrolü performans, değişiklik, hak talepleri ve sözleşme şartlarını izler.","Satıcı ek ücret istediğinde önce sözleşme ve değişiklik hükümlerini incele, gerekirse yetkili satın alma/hukuk ekibiyle değerlendir.","Net kapsam → sabit fiyat; belirsiz araştırma → maliyet geri ödemeli değerlendir; birim ücret → zaman ve malzeme.","Sözleşme dışı talebi sözlü onaylamak, proje yöneticisinin her sözleşme kararına yetkili olduğunu varsaymak."],["İş değeri ve faydalar","İş gerekçesi yatırımın nedenini ve ekonomik/stratejik değerini açıklar. Fayda yönetimi planı beklenen faydaları, ölçütleri, zamanlamayı ve sahipleri tanımlar. Çıktı üretilen ürün, sonuç kullanımın yarattığı değişim, fayda ölçülebilir değerdir. MVP varsayımları en az uygulanabilir ürünle test eder. Değer teslimatı sadece proje sonunda değil, yaşam döngüsü boyunca izlenebilir.","Yeni uygulama teslim edildi ancak kullanım düşük. Teslimatın tamamlanması tek başına faydanın gerçekleştiği anlamına gelmez; benimsenme ve iş sonuçları ölçülmelidir.","Stratejik uyum bozuldu → iş gerekçesini değerlendir; erken öğrenme → MVP; fayda sahibi → operasyon/iş birimi.","Bütçede biten her projeyi otomatik başarılı saymak."],["Takvim ve kaynak","Kritik yol en uzun süreli bağımlılık yoludur ve en erken proje bitişini belirler. Toplam bolluk bir faaliyetin proje bitişini geciktirmeden kayabileceği süredir. FS bitiş-başlangıç, SS başlangıç-başlangıç, FF bitiş-bitiş, SF başlangıç-bitiştir. Crashing ek kaynakla süreyi kısaltır ve maliyeti artırabilir; fast tracking işleri örtüştürür ve yeniden iş riskini artırır. Kaynak dengeleme kritik yolu değiştirebilir. PERT=(iyimser+4×en olası+kötümser)/6.","İki yol A-B=8 gün, C-D=11 gün ise kritik yol C-D'dir. Kritik olmayan işi kısaltmak proje bitişini değiştirmeyebilir.","Ek kaynak → crashing; paralelleştirme → fast tracking; üç nokta ağırlıklı tahmin → PERT.","En çok faaliyet içeren yolu kritik sanmak; kaynak dengelemenin süreyi asla değiştirmediğini düşünmek."],["Öğrenme ve retrospektif","Öğrenilen dersler proje boyunca kaydedilir; yalnızca kapanışta hazırlanmaz. Retrospektif ekip çalışma biçimini inceler, uygulanabilir iyileştirme aksiyonları üretir. Review ürün artımını paydaşlarla inceler. Bilgi yönetiminde açık bilgi dokümante edilebilir; örtük bilgi deneyim ve etkileşimle aktarılır. Kapanışta kabul, devir, arşiv, sözleşme kapanışı ve kaynakların serbest bırakılması ele alınır.","Her sprintte test darboğazı yaşanıyor. Retrospektifte nedenleri tartış, küçük bir iyileştirme deneyi seç, sonraki sprintte etkisini ölç.","Süreç → retro; ürün → review; deneyim aktarımı → mentorluk; kapanış → resmi devir ve arşiv.","Retrospektifi suçlama toplantısına dönüştürmek veya dersleri sadece sona bırakmak."],["Yönetişim, etik ve uyum","Yönetişim karar yetkilerini, hesap verebilirliği ve kontrol mekanizmalarını tanımlar. Uyum gereksinimleri belirlenmeli, izlenmeli ve kanıtlanmalıdır. PMI etik ilkeleri sorumluluk, saygı, adalet ve dürüstlüktür. Çıkar çatışmaları açıklanır; yanlış raporlama kabul edilmez. Güvenlik veya mevzuat ihlali varsa zarar önlenir ve yetkili kanallara uygun bildirim yapılır.","Yönetici gecikmeyi gizlemeni isterse gerçek veriyi raporla, uygun etik ve yönetişim sürecini izle.","Yetki dışı karar → eskalasyon; mevzuat ihlali → uygun bildirim ve düzeltme; çıkar çatışması → açıklama.","Her durumda önce uzun analiz yapmak; acil güvenlik tehdidinde gecikmek; etik ihlali örtbas etmek."],["AI ve sürdürülebilirlik","Yapay zekâ tahmin, özetleme ve risk tespitini destekleyebilir; karar sorumluluğu insanda kalır. Veri gizliliği, güvenlik, doğruluk, önyargı ve izlenebilirlik değerlendirilmelidir. Sürdürülebilirlik çevresel, sosyal ve ekonomik etkileri yaşam döngüsü boyunca ele alır. Alternatifler yalnızca kısa vadeli maliyetle değil uzun vadeli değer ve riskle değerlendirilir.","AI risk raporu oluşturduğunda kaynak verileri doğrula, hassas verinin işlenmesine izin olup olmadığını kontrol et, uzman değerlendirmesiyle sonuçları kullan.","AI önerisi → insan doğrulaması; hassas veri → politika ve yetki; sürdürülebilirlik → yaşam döngüsü etkisi.","AI çıktısını otomatik gerçek kabul etmek veya sürdürülebilirliği yalnızca çevre maliyetine indirgemek."],["Hibrit ve yaklaşım seçimi","Öngörücü yaklaşım kapsam ve gereksinimler istikrarlı olduğunda ayrıntılı ön planlama sağlar. Çevik yaklaşım değişken ihtiyaçlarda kısa geri bildirim ve artımlı değer sağlar. Yinelemeli yaklaşım çözümü tekrarlarla geliştirir; artımlı yaklaşım parçalar halinde teslim eder. Hibrit yaklaşım farklı bileşenlerde uygun yöntemleri birleştirir. Tailoring proje bağlamına göre süreç ve uygulamaları uyarlamaktır.","Donanım tedariki sabit şartlara bağlı, yazılım ihtiyaçları değişken ise donanım için öngörücü, yazılım için çevik uygulamalar seçilebilir; ortak bağımlılıklar ve yönetişim planlanır.","Belirsizlik yüksek → çevik değerlendir; sabit düzenleyici teslimatlar → öngörücü değerlendir; karma koşullar → hibrit; bağlama uyarlama → tailoring.","Her projeye aynı yöntemi zorlamak veya çevikte planlama olmadığını sanmak."],["Proje başlatma ve entegrasyon","Proje başlatma belgesi (charter) sponsor tarafından yetkilendirilir ve proje yöneticisine kaynak kullanma yetkisi verir. İş gerekçesi yatırımın nedenini açıklar; proje yönetim planı ise işin nasıl yürütüleceğini tanımlar. Temel çizgiler onaylanmış kapsam, takvim ve maliyet referanslarıdır. Proje yöneticisi bağımlılıkları ve değişikliklerin bütünsel etkisini yönetir. İş performans verisi ham ölçüm, bilgi analiz edilmiş veri, rapor karar vericilere sunulan bilgidir.","Sponsor proje başlamadan ayrıntılı iş planı istiyor. Önce yetkilendirme ve üst düzey hedefler netleştirilir, ardından ekip ile plan geliştirilir.","Yetkilendirme → charter; yatırım gerekçesi → business case; yürütme yöntemi → yönetim planı; ham ölçüm → veri.","Charter ile ayrıntılı planı karıştırma; proje yöneticisinin kendi projesini yetkilendirdiğini varsayma."],["Gereksinim ve WBS","Gereksinimler görüşme, atölye, gözlem, prototip ve anketlerle toplanabilir. Gereksinim izlenebilirlik matrisi iş ihtiyacını teslimat ve kabul testine bağlar. WBS teslimat odaklı hiyerarşik ayrıştırmadır; iş paketi en alt yönetilebilir seviyedir. WBS sözlüğü iş paketlerinin açıklama, kabul ölçütü ve sorumluluklarını içerir. Kapsam temel çizgisi kapsam bildirimi, WBS ve sözlükten oluşur. Ürün kapsamı ürün özellikleri, proje kapsamı bu ürünü üretmek için yapılan iştir.","Müşteri bir gereksinimin neden geliştirildiğini sorguluyor. İzlenebilirlik matrisinden iş hedefi ve kabul kriteri bulunur.","Teslimat ayrıştırma → WBS; gereksinim-test bağı → RTM; iş paketi ayrıntısı → sözlük.","WBS'yi kronolojik görev takvimi sanma; onaysız özellik ekleme."],["Kaynak yönetimi ve RACI","Kaynak yönetim planı fiziksel ve insan kaynaklarının nasıl edinileceğini ve yönetileceğini belirler. RACI: Responsible işi yapan, Accountable sonuçtan hesap veren, Consulted görüşü alınan, Informed bilgilendirilen. Her iş için tek hesap veren belirlemek belirsizliği azaltır. Kaynak histogramı zaman içindeki kaynak ihtiyacını gösterir. Kaynak dengeleme kaynak kısıtına göre takvimi değiştirebilir; kaynak düzeltme mevcut bolluk içinde kalır. Ekip geliştirme eğitim, güven ve iş birliğini destekler.","Bir iş iki yönetici tarafından onaylanıyor ve gecikiyor. RACI ile tek hesap veren ve karar sınırları belirlenir.","Rol belirsizliği → RACI; kaynak çakışması → dengeleme; beceri açığı → eğitim.","Responsible ve Accountable aynı kavram değildir."],["Çevik tahmin ve ürün planlama","User story kullanıcı, ihtiyaç ve değeri ifade eder; kabul kriterleri belirli hikâyenin koşullarıdır, Definition of Done tüm artımlar için kalite standardıdır. Story point göreli karmaşıklık ve belirsizlik ölçüsüdür. Planning poker ekip tahminini kolaylaştırır. Velocity geçmişte tamamlanan iş miktarıdır. Burndown kalan işi, burnup tamamlanan işi ve toplam kapsamı gösterir. MVP öğrenme amacıyla minimum uygulanabilir üründür. MoSCoW Must, Should, Could, Won't önceliklerini kullanır.","Ekip sprint başına 20 puan tamamlıyor, backlog 100 puan. Kaba tahmin 5 sprinttir; değişkenlik ve yeni kapsam nedeniyle kesin taahhüt değildir.","Kalan iş → burndown; kapsam artışı → burnup; göreli tahmin → story point; öncelik → ürün sahibi.","Story point'i doğrudan saate çevirme; velocity ile kişileri sıralama."],["Risk hesapları ve karar ağacı","Beklenen parasal değer (EMV) olasılık × parasal etkidir. Tehdit negatif, fırsat pozitif değer alabilir. Karar ağacı alternatiflerin olasılıklı sonuçlarını karşılaştırır. Monte Carlo simülasyonu çok sayıda olası sonuç üzerinden maliyet veya süre dağılımı üretir. Duyarlılık analizi sonucu en çok etkileyen değişkenleri belirler; tornado grafiği kullanılabilir. Risk iştahı kabul edilmeye istekli risk düzeyi, eşik ise aksiyon gerektiren sınırdır.","%30 olasılıkla 100.000 TL kayıp ve %20 olasılıkla 50.000 TL kazanç varsa toplam EMV −30.000+10.000=−20.000 TL. Bu kesin zarar değildir.","Olasılık × etki → EMV; dağılım → Monte Carlo; en etkili değişken → duyarlılık.","EMV'yi gerçekleşecek kesin tutar sanma."],["Maliyet tahmini ve rezervler","Analog tahmin benzer geçmiş projeye, parametrik tahmin birim oranlara, aşağıdan yukarı tahmin ayrıntılı iş paketlerine dayanır. Maliyet temel çizgisi beklenmedik durum rezervini içerir, yönetim rezervini içermez. Proje bütçesi temel çizgi ve yönetim rezervinden oluşur. TCPI kalan işin hedef bütçeye göre gerektirdiği maliyet performansıdır: (BAC−EV)/(BAC−AC). EAC−AC kalan tahmini maliyettir.","BAC 1000, EV 400, AC 500 ise TCPI=600/500=1,2. Kalan işte daha iyi maliyet verimliliği gerekir.","Benzer proje → analog; birim fiyat → parametrik; ayrıntılı paket → bottom-up; bilinmeyen belirsizlik → yönetim rezervi.","Rezervleri birbirine karıştırma; TCPI yüksekliğini mevcut iyi performans sanma."],["İletişim, değişim ve direnç","İletişim yönetimi bilgi ihtiyacına göre kanal ve sıklığı belirler. Aktif dinleme, geri bildirim ve ortak anlayış önemlidir. Organizasyonel değişim teknik teslimatın ötesinde benimsenme gerektirir; etkilenen gruplar, değişim temsilcileri, eğitim, destek ve kullanım ölçütleri planlanır. Direnç bilgi eksikliği, iş yükü veya güven kaygısından kaynaklanabilir. Önce nedeni belirlemek, ardından uygun müdahale seçmek gerekir.","Yeni uygulama çalışanlar tarafından kullanılmıyor. Kullanıcı görüşmeleriyle engelleri belirle, eğitim ve süreç düzenlemesi yap, benimsenmeyi ölç.","Benimsenme → değişim yönetimi; yanlış anlaşılma → etkileşimli iletişim; direnç → neden analizi.","Sadece e-posta göndermeyi değişim yönetimi sanma."],["Kalite araçları ve kabul","Histogram dağılımı, saçılım grafiği iki değişken arasındaki ilişkiyi, akış şeması süreç adımlarını, kontrol listesi gerekli kontrolleri gösterir. Kontrol grafiği zaman içinde süreç davranışını izler. Denetim süreç uygunluğunu değerlendirir. Kalite kontrol doğrulanmış teslimat üretir; kapsam doğrulama kabul edilmiş teslimat üretir. Önleme hatanın oluşmasını engeller, değerlendirme hatayı tespit eder.","Üretim hatası müşteriye ulaşmadan bulunursa iç hata maliyeti; müşteriye ulaştıktan sonra garanti onarımı dış hata maliyetidir.","Dağılım → histogram; ilişki → scatter; süreç adımı → flowchart; resmi kabul → validate scope.","Korelasyonu nedensellik sanma; denetim ile müşteri kabulünü karıştırma."],["Sözleşme türleri ve kapanış","FFP sabit toplam fiyat, FPIF teşvikli sabit fiyat, FPEPA ekonomik fiyat ayarlamalı sabit fiyattır. CPFF maliyet artı sabit ücret, CPIF teşvikli ücret, CPAF ödül ücretidir. T&M zaman ve malzeme bazlıdır; üst limit ve kontrol mekanizması yararlı olabilir. Teklif değerlendirmesinde fiyat yanında teknik uygunluk, risk ve kapasite incelenir. Sözleşme kapanışında teslimat kabulü, hak talepleri, ödemeler ve kayıtlar kontrol edilir.","Uzun süreli sözleşmede enflasyon belirsizliği yüksekse ekonomik fiyat ayarlama maddesi değerlendirilebilir.","Ekonomik fiyat ayarı → FPEPA; maliyet artı sabit ücret → CPFF; saatlik ücret → T&M.","Sözleşme türünü yalnızca en düşük fiyata göre seçme."],["İş ortamı ve yönetişim ayrıntıları","İş ortamı iç ve dış koşulları kapsar: mevzuat, pazar, teknoloji, kurum kültürü, strateji. EEF kurumsal çevresel faktörler, OPA organizasyonel süreç varlıklarıdır. Şablonlar ve geçmiş dersler OPA; mevzuat, kültür ve pazar EEF örneğidir. Fayda ölçütleri teslimat sonrası da izlenebilir. Yönetişim karar yetkilerini, eskalasyon yollarını ve kontrol noktalarını belirler. Uyum gereksinimleri değiştiğinde etki değerlendirilir ve gerekli aksiyon yetkili süreçle alınır.","Yeni veri koruma düzenlemesi yayınlandı. Uyum uzmanıyla kapsam ve risk etkisini belirle, değişiklikleri yönet ve kanıtları sakla.","Şablon → OPA; mevzuat → EEF; yatırım değeri → business case; karar yetkisi → governance.","Yasal zorunluluğu isteğe bağlı kapsam değişikliği sanma."],["PMP soru çözme stratejisi","Önce soru kökünü oku: ilk, sonraki, en iyi, önlemek için veya ne yapmalı ifadeleri farklı karar aşamalarını sorar. Yaklaşımı belirle: öngörücü, çevik veya hibrit. Olayın gerçekleşip gerçekleşmediğini, yetkiyi ve aciliyeti ayırt et. Normal durumda bilgi topla, kök nedeni ve etkiyi değerlendir, ekiple çözüm üret, yetkili süreçleri izle. Acil güvenlik ve etik durumlarda koruyucu müdahale geciktirilmez. Eskalasyon yetki dışı veya çözülemeyen konularda uygundur.","Müşteri değişiklik istiyor: öngörücü projede etki analizi ve onay; çevikte ürün sahibiyle önceliklendirme. Aynı kelime farklı bağlamda farklı cevap verir.","İlk → mevcut durumu değerlendir; önlemek → proaktif plan; gerçekleşti → sorun yönetimi; yetki dışı → eskalasyon.","Her soruda otomatik olarak önce analiz veya asla eskalasyon kuralı uygulama."],["Ortak vizyon ve başarı ölçütleri","Vizyon işin hangi sonucu ve değeri yaratacağını açıklar. Sponsor, müşteri ve ekip başarıyı farklı tanımlayabilir; ortak hedef, ölçülebilir sonuç ve karar kriterleri üzerinde uzlaşılır. Vizyon yeni bilgiyle güncellenir; çıktı ve sonuç aynı değildir.","Hasar ekranı teslimi çıktı, işlem süresinin azalması sonuçtur.","Farklı başarı beklentileri varsa önce ortak vizyon ve ölçütleri netleştir.","Sadece tarih, kapsam veya bütçeyi proje başarısı saymak."],["Bilgi aktarımı ve ekip öğrenmesi","Kritik bilgi belirlenir, dokümante edilir, eşli çalışma ve uygulama ile aktarılır. Açık bilgi dokümanlarla, örtük bilgi deneyim ve mentorlukla paylaşılır. Aktarım başarısı alıcının işi bağımsız yapabilmesiyle doğrulanır.","Ayrılacak uzman kritik entegrasyonu yeni üye ile birlikte çalışır; yeni üye işlemi tek başına tekrarlar.","Uzman ayrılıyor veya operasyon hazır değilse aktarım ve yeterlilik kontrolü düşün.","Sadece e-posta veya katılım listesiyle aktarımı tamamlanmış saymak."],["Paydaş beklentileri ve müşteri memnuniyeti","Paydaş kaydı, güç/ilgi/etki analizi ve katılım yaklaşımı güncellenir. Kabul ölçütleri ile memnuniyet farklı olabilir. Geri bildirim döngüsü oluştur, farklı bilgi ihtiyaçlarına göre iletişimi uyarla.","Kabul edilen ekran iş yükünü artırıyorsa gerçek iş sonucunu müşteriyle değerlendir.","Yeni paydaş, direnç veya memnuniyetsizlikte önce ihtiyacı ve nedenleri anlamak.","Sadece rapor sıklığını artırmak ya da tüm talepleri onaysız kabul etmek."],["Proje durumu, ölçümler ve kayıtlar","Ölçütler hedefe uygun seçilir. EVM öngörücü maliyet/takvim ölçümü; çevikte çevrim süresi, throughput, WIP, burnup ve değer ölçütleri önemlidir. Artefaktlar sürüm kontrollü ve yetkili erişime açık tutulur.","Burnup toplam kapsam çizgisi hızla yükselirken biten iş aynı hızda artıyorsa sürüm riski vardır.","Ölçütler çelişiyorsa veri, varsayım ve bağlamı doğrula.","Ekipler arasında story point hızını performans sıralaması yapmak için kullanmak."],["Kapanış ve operasyonel devir","Resmi kabul, kapanış kriterleri, sözleşme/mali kapanış, kaynakların serbest bırakılması, derslerin aktarımı ve operasyonel hazırlık kontrol edilir. İptal edilen proje de kontrollü kapanır. Fayda sahibi ve izleme sorumluluğu proje sonrası devredilir.","Sistem kabul edilmiş ancak destek ekibi hazırlıksızsa devir kriterleri tamamlanır.","Kabul edildi ama operasyon hazır değil: hazırlığı ve sorumluluğu doğrula.","Teknik teslimatı tek başına kapanış saymak."],["Organizasyonel değişim ve dış iş ortamı","Kültür, benimseme ve etkilenen gruplar incelenir. Piyasa, mevzuat, teknoloji ve jeopolitik değişimler kapsam, risk, fayda ve backlog'u etkileyebilir. İş gerekçesi yeniden değerlendirilir; stratejik karar yetkili yönetişimle alınır.","Yeni mevzuat ürün tesliminden sonra yürürlüğe girecekse yaşam döngüsü ve geçiş etkisi incelenir.","Dış değişim veya dirençte etkiyi değerlendir, ilgili paydaşlarla uygun aksiyonu belirle.","Mevcut planı her durumda korumak veya kapsamı tek taraflı değiştirmek."],["Engeller, sorunlar ve sürekli iyileştirme","Risk belirsizdir, sorun gerçekleşmiş olaydır. Engeller önceliklendirilir, sorumlular ve eskalasyon eşikleri belirlenir. Retrospektif ve öğrenilen dersler ile kök nedenler ele alınır; iyileştirme deneyleri ölçülür.","Dış onay her sprintte gecikiyorsa geçici çözümün yanında sistemik nedeni ele al.","Gerçekleşen riskte sorun kaydı ve yanıt; tekrarlayan engelde kök neden.","Her sorunu doğrudan sponsora devretmek ya da sadece kayıt tutmak."]];let S=JSON.parse(localStorage.getItem('pmp-v1')||'{}');S.done??=[];S.answers??={};S.daily??={};S.goal??=80;const save=()=>localStorage.setItem('pmp-v1',JSON.stringify(S));const v=document.querySelector('#view');const today=()=>new Date().toLocaleDateString('sv-SE');const days=()=>S.date?Math.max(0,Math.round((new Date(S.date+'T00:00:00')-new Date(today()+'T00:00:00'))/86400000)):null;let tab=0;const tabs=['Ana sayfa','Takvim','Konular','Hap bilgiler','Test','Yanlışlar'];document.querySelector('#nav').innerHTML=tabs.map((t,i)=>'<button onclick="show('+i+')">'+t+'</button>').join('');function stats(){let a=[...Object.values(S.answers),...Object.values(S.bankAnswers||{})];return a.length?Math.round(a.filter(Boolean).length/a.length*100):0}function show(i){clearInterval(timer);tab=i;let n=days();if(i===0){v.innerHTML='<section><h2>'+(n===null?'Sınav tarihini belirle':n+' gün kaldı')+'</h2><label>Sınav tarihi <input type="date" id="date"></label><label>Hedef başarı (%) <input type="number" min="1" max="100" id="goal"></label><button onclick="settings()">Kaydet</button></section><section><h2>İlerleme</h2>Konu: '+S.done.length+'/'+L.length+'<progress max="'+L.length+'" value="'+S.done.length+'"></progress>Test başarısı: %'+stats()+' · Hedef: %'+S.goal+'<progress max="100" value="'+stats()+'"></progress><button onclick="start(false,10)">Seviye testi</button></section>';document.querySelector('#date').value=S.date||'';document.querySelector('#goal').value=S.goal;}if(i===1){let count=Math.min(365,Math.max(1,n??14)),base=new Date(today()+'T12:00:00');v.innerHTML='<h2>Çalışma takvimi</h2>'+Array.from({length:count},(_,j)=>{let d=new Date(base);d.setDate(d.getDate()+j);let key=d.toLocaleDateString('sv-SE'),idx=j%L.length;return '<article><b>'+d.toLocaleDateString('tr-TR')+'</b><p>'+L[idx][0]+' · 10 dk tekrar · soru çözümü</p><label><input type="checkbox" '+(S.daily[key]?'checked':'')+' onchange="S.daily[\''+key+'\']=this.checked;save()"> Gün tamamlandı</label><button onclick="lesson('+idx+')">Konuya git</button></article>'}).join('')}if(i===2)v.innerHTML='<h2>PMP 2026 Konu Kampı</h2>'+[['İnsan ve ekip · %33',[25,3,4,16,26,27]],['Süreç · %41',[13, cludes(t.toLocaleLowerCase('tr')))?i:-1).filter(i=>i>=0);if(!ids.length)ids=BANK.map((_,i)=>i);bankPractice(12,ids)}let Q=[],pos=0,correct=0,locked=false;function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function start(w,n){Q=shuffle(D.map((_,i)=>i).filter(i=>!w||S.answers[i]===false)).slice(0,n);pos=0;correct=0;question()}function question(){locked=false;if(pos>=Q.length){v.innerHTML='<section><h2>'+(Q.length?'Test tamamlandı':'Tekrar edilecek soru yok')+'</h2><p>'+correct+'/'+Q.length+' doğru</p><button onclick="show(0)">Ana sayfa</button></section>';return}let d=D[Q[pos]];v.innerHTML='<section><small>Soru '+(pos+1)+' / '+Q.length+'</small><h3>'+d[2]+'</h3>'+shuffle([3,4,5,6]).map(k=>'<button class="option" onclick="answer('+k+')">'+d[k]+'</button>').join('')+'<div id="feedback"></div></section>'}function answer(k){if(locked)return;locked=true;let ok=k===3;S.answers[Q[pos]]=ok;correct+=Number(ok);save();document.querySelector('#feedback').innerHTML='<p class="'+(ok?'right':'wrong')+'">'+(ok?'Doğru!':'Doğru cevap: '+D[Q[pos]][3])+'</p><p>'+D[Q[pos]][1]+'</p><button onclick="pos++;question()">Devam</button>'}const BANK=[{"domain":"İnsan","topic":"Ekip çatışması","q":"Bir sigorta şirketinin dijital dönüşüm projesinde: İki ekip üyesi çözüm konusunda anlaşamıyor ve ilerleme yavaşlıyor. Proje yöneticisinin en uygun yaklaşımı nedir?","opts":["Tarafları dinleyip ortak karar kriterleri belirlemek","Bir tarafın önerisini hemen zorunlu kılmak","Her anlaşmazlığı sponsora devretmek","Konuyu performans değerlendirmesine kadar bekletmek"],"ex":"Tarafları dinleyip ortak karar kriterleri belirlemek. Bu yaklaşım ekip çatışması açısından sorunun nedenini veya etkisini ele alır; diğer seçenekler gerekli değerlendirme ya da yetki sürecini atlar."},{"domain":"İnsan","topic":"Koçluk","q":"Bir sigorta şirketinin dijital dönüşüm projesinde: Ekip üyesi yeni teknolojide zorlanıyor ancak öğrenmeye istekli. Proje yöneticisinin en uygun yaklaşımı nedir?","opts":["İhtiyacı belirleyip koçluk ve eşli çalışma sağlamak","Görevi kalıcı olarak elinden almak","Hedefi tek taraflı düşürmek","Üyeyi değiştirmek"],"ex":"İhtiyacı belirleyip koçluk ve eşli çalışma sağlamak. Bu yaklaşım koçluk açısından sorunun nedenini veya etkisini ele alır; diğer seçenekler gerekli değerlendirme ya da yetki sürecini atlar."},{"domain":"İnsan","topic":"Paydaş katılımı","q":"Bir sigorta şirketinin dijital dönüşüm projesinde: Etkili bir paydaş yeni çözüme direniyor ve gerekçesi bilinmiyor. Proje yöneticisinin en uygun yaklaşımı nedir?","opts":["Paydaşla görüşüp kaygılarını ve beklentilerini anlamak","Paydaşı iletişim listesinden çıkarmak","Tüm taleplerini doğrudan kabul etmek","Sadece sponsora raporlamak"],"ex":"Paydaşla görüşüp kaygılarını ve beklentilerini anlamak. Bu yaklaşım paydaş katılımı açısından sorunun nedenini veya etkisini ele alır; diğer seçenekler gerekli değerlendirme ya da yetki sürecini atlar."},{"domain":"İnsan","topic":"Sanal ekip","q":"Bir sigorta şirketinin dijital dönüşüm projesinde: Farklı saat dilimlerindeki ekipler kararları kaçırıyor. Proje yöneticisinin en uygun yaklaşımı nedir?","opts":["Ekiple ortak iletişim normları ve erişilebilir karar kaydı oluşturmak","Herkesi aynı saat diliminde çalışmaya zorlamak","Toplantı sayısını iki katına çıkarmak","İletişimi yalnızca yöneticilerle sınırlamak"],"ex":"Ekiple ortak iletişim normları ve erişilebilir karar kaydı oluşturmak. Bu yaklaşım sanal ekip açısından sorunun nedenini veya etkisini ele alır; diğer seçenekler gerekli değerlendirme ya da yetki sürecini atlar."},{"domain":"İnsan","topic":"Yetkilendirme","q":"Bir sigorta şirketinin dijital dönüşüm projesinde: Çevik ekip her küçük teknik kararda yönetici onayı bekliyor. Proje yöneticisinin en uygun yaklaşımı nedir?","opts":["Karar sınırlarını netleştirip ekibin özerkliğini desteklemek","Tüm kararları proje yöneticisine vermek","Sprint hedeflerini kaldırmak","Onay sürecine yeni bir komite eklemek"] opic":"Koçluk","q":"Yeni Scrum ekibi her sprintte kapasitesinden fazla iş seçiyor. Sponsor daha yüksek hız istiyor. Scrum Master ne yapmalı?","opts":["Ekiple geçmiş kapasiteyi ve tamamlanma verilerini inceleyip gerçekçi planlamayı kolaylaştırmak","Ürün sahibinden sprint kapsamını sabitlemesini istemek","Sponsorla daha yüksek hız hedefi üzerinde anlaşmak","Her geliştirici için bireysel puan hedefi belirlemek"],"ex":"Hız bir tahmin aracıdır; sürdürülebilir kapasiteyi anlamak gerekir."},{"domain":"Süreç","topic":"EVM","q":"BAC 2000, EV 900, AC 1000, PV 1200. Kalan işte hem maliyet hem takvim verimliliğinin maliyeti etkileyeceği varsayılıyor. EAC yaklaşık kaçtır?","opts":["2630","2222","2100","2467"],"ex":"CPI=0,9, SPI=0,75; EAC=1000+1100/(0,9×0,75)≈2630."},{"domain":"İş ortamı","topic":"Risk","q":"Bir risk yanıtı için 80 bin TL harcanması öneriliyor. Tehdidin olasılığı %20, etkisi 300 bin TL; yanıt sonrası olasılık %5. Yalnızca EMV dikkate alınırsa ne yapılmalı?","opts":["Yanıt maliyetini beklenen 45 bin TL risk azalmasıyla karşılaştırıp alternatif aramak","80 bin TL yanıtı onaylamak çünkü etki 300 bin TL","Yanıtı onaylamak çünkü olasılık dörtte bire düşüyor","60 bin TL yönetim rezervi ayırıp yanıtı uygulamak"],"ex":"EMV azalması 60−15=45 bin TL; diğer risk ölçütleri ayrıca değerlendirilir."},{"domain":"Süreç","topic":"Takvim","q":"Kritik yol 30 gün, ikinci yol 28 gün. Kritik yoldaki faaliyet 4 gün kısaltılıyor, diğer yollar değişmiyor. Yeni proje süresi?","opts":["28 gün","26 gün","30 gün","24 gün"],"ex":"İkinci yol kritik hale gelir."},{"domain":"Süreç","topic":"Kapsam","q":"Müşteri kabul kriterleri sağlanmış teslimata yeni bir erişilebilirlik özelliği istiyor. Özellik yasal zorunluluk değil. Öngörücü projede en uygun adım?","opts":["Mevcut kabulü yeni talepten ayırıp değişiklik etkisini değerlendirmek","Yeni özelliği kusur olarak kalite kaydına almak","Kabul kriterlerini müşteri talebine göre hemen güncellemek","Yeni özelliği garanti kapsamında geliştirmek"],"ex":"Y function formatText(q,a){if(a==null)return 'Boş';return matchKind(q)?q.targets.map((t,i)=>t+' → '+(q.opts[a[i]]??'Boş')).join(' • '):Array.isArray(a)?a.map(i=>q.opts[i]).join(' / '):q.opts[a]??'Boş'}
function formatType(q){return q.type||(q.caseId!==undefined?'case':q.multi?'multi':'single')}
makeOrder=function(){let ca=shuffle([...new Set(BANK.filter(q=>q.caseId!==undefined).map(q=>q.caseId))]).flatMap(c=>BANK.map((q,i)=>q.caseId===c?i:-1).filter(i=>i>=0)),rest=[];for(let d of Object.keys(domainTargets)){let pool=shuffle(BANK.map((q,i)=>q.domain===d&&q.caseId===undefined?i:-1).filter(i=>i>=0)),special=pool.filter(i=>BANK[i].type||BANK[i].multi),n=domainTargets[d]-ca.filter(i=>BANK[i].domain===d).length;if(special.length>n||pool.length<n)throw Error('Soru dağılımı');rest.push(...special,...pool.filter(i=>!special.includes(i)).slice(0,n-special.length))}return ca.concat(shuffle(rest))};
let formatPicked=null;

function chipPick(mode,k){formatPicked={mode,k};document.querySelectorAll('[data-chip]').forEach(el=>el.classList.toggle('chosen',Number(el.dataset.chip)===k))}

function chipDrop(e,mode,j){e.preventDefault();let k=e.dataTransfer.getData('text/plain');if(k!=='')matchPlace(mode,j,Number(k))}
function matchRemove(mode,j){let a=formatA(mode),r=Array.isArray(a)?a.slice():[];r[j]=null;setFormat(mode,r.some(Number.isInteger)?r:null)}

function formatVisual(q,a,mode,locked=false){let v=q.visual;if(!v)return '';if(v.kind==='table')return '<div class="visualscroll"><table><thead><tr>'+v.headers.map(x=>'<th>'+htmlSafe(x)+'</th>').join('')+'</tr></thead><tbody>'+v.rows.map(r=>'<tr>'+r.map(x=>'<td>'+htmlSafe(x)+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>';
let W=560,H=290,L=48,R=28,T=35,B=45,top=Math.ceil(Math.max(1,...v.series.flatMap(s=>s.v))/10)*10,x=i=>L+i*(W-L-R)/Math.max(1,v.labels.length-1),y=n=>T+(H-T-B)*(1-n/top),colors=['#b54b58','#2867b0'];let s='<svg viewBox="0 0 560 290" class="chartsvg" aria-label="'+htmlSafe(v.title)+'"><text x="280" y="20" text-anchor="middle" font-size="16">'+htmlSafe(v.title)+'</text>';for(let i=0;i<=5;i++){let n=top*i/5;s+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y(n)+'" y2="'+y(n)+'" stroke="#ddd"/><text x="'+(L-5)+'" y="'+(y(n)+4)+'" text-anchor="end" font-size="11">'+Number(n.toFixed(1))+'</text>'}for(let i=0;i<v.labels.length;i++)s+='<text x="'+x(i)+'" y="270" text-anchor="middle" font-size="12">'+htmlSafe(v.labels[i])+'</text>';

function formatRender(q,a,order,mode,locked=false){let d=locked?' disabled':'',s='<span class="qkind">'+htmlSafe(formatNames[formatType(q)])+'</span>';if(q.context)s+='<article class="casebox"><b>Vaka / senaryo</b><p>'+htmlSafe(q.context)+'</p></article>';s+=formatVisual(q,a,mode,locked)+'<h3>'+htmlSafe(q.q)+'</h3>';if(q.type==='hotspot')return s+'<p>'+htmlSafe(q.visual.series[q.series].name)+' serisinde uygun noktaya dokun.</p><p>Seçim: '+htmlSafe(formatText(q,a))+'</p>';if(q.type==='dropdown')return s+'<select style="width:100%" aria-label="Cevap" onchange="formatSelect(&quot;'+mode+'&quot;,this)"'+d+'><option value="">Seç...</option>'+order.map(k=>'<option value="'+k+'" '+(a===k?'selected':'')+'>'+htmlSafe(q.opts[k])+'</option>').join('')+'</select>';if(matchKind(q)){s+='<p>Öğeyi sürükleyip hedefe bırak veya önce öğeye, sonra hedefe dokun.</p><div class="chips">';for(let k of order)s+='<button class="chip" data-chip="'+k+'" draggable="'+!locked+'" ondragstart="chipDrag(event,'+k+')" onclick="'+fnAttr('chipPick',mode,k)+'"'+d+'>'+htmlSafe(q.opts[k])+(Array.isArray(a)&&a.includes(k)?' ✓':'')+'</button>';s+='</div>';for(let j=0;j<q.targets.length;j++)s+='<div class="matchrow"><b>'+htmlSafe(q.targets[j])+'</b><button class="dropzone" ondragover="event.preventDefault()" ondrop="chipDrop(event,&quot;'+mode+'&quot;,'+j+')" onclick="'+fnAttr('matchPlace',mode,j)+'"'+d+'>'+htmlSafe(q.opts[a?.[j]]??'Buraya bırak')+'</button><button onclick="'+fnAttr('matchRemove',mode,j)+'"'+d+'>×</button></div>';return s}if(q.multi)s+='<p>İki seçenek işaretle.</p>';for(let j=0;j<order.length;j++){let k=order[j],on=q.multi?Array.isArray(a)&&a.includes(k):a===k,click=mode==='exam'?fnAttr('pickExam',E.order[E.pos],k):fnAttr('bankPick',k);s+='<button class="option" aria-pressed="'+on+'" style="'+(on?'background:#ddd8ff;border:2px solid #5145d9':'')+'" onclick="'+click+'"'+d+'>'+String.fromCharCode(65+j)+'. '+htmlSafe(q.opts[k])+'</button>'}return s}
correctExam=function(id){return formatCorrect(BANK[id],E.a[id])};
examPage=function(){clearInterval(timer);formatPicked=null;if(!E)return examHome();if(E.finished)return examResult();if(E.breakUntil){if(Date.now()>=E.breakUntil)return endBreak();return breakPage()}if(Date.now()>=E.end)return finishExam(true);let id=E.order[E.pos],q=BANK[id],lo=sections[E.section],hi=sections[E.section+1],n=E.order.filter(i=>formatFull(BANK[i],E.a[i])).length;v.innerHTML='<section><div style="display:flex;justify-content:space-between"><b>Bölüm '+(E.section+1)+'/3</b><b id="examClock"></b></div><p>Soru '+(E.pos+1)+' / 180 · Cevaplanan '+n+'</p><progress max="180" value="'+n+'"></progress>'+formatRender(q,E.a[id],E.options[id],'exam')+'<button onclick="clearAnswer()">Cevabı temizle</button><button onclick="toggleFlag()">'+(E.flags[id]?'★ İşaretli':'☆ Sonra bak')+'</button><p><button onclick="moveExam(-1)" '+(E.pos===lo?'disabled':'')+'>Önceki</button><button onclick="moveExam(1)">'+(E.pos===hi-1?'Bölümü gözden geçir':'Sonraki')+'</button></p><details><summary>Bölüm soru haritası</summary>'+E.order.slice(lo,hi).map((x,j)=>'<button style="background:'+(E.flags[x]?'#946a25':formatFull(BANK[x],E.a[x])?'#5145d9':'#8791a4')+'" onclick="jumpExam('+(lo+j)+')">'+(lo+j+1)+'</button>').join('')+'</details><button onclick="reviewSection()">Bölümü bitir</button></section>';clock();if(!E.finished)timer=setInterval(clock,1000)};
reviewSection=function(){clearInterval(timer);let lo=sections[E.section],hi=sections[E.section+1],ids=E.order.slice(lo,hi);v.innerHTML='<section><h2>Bölüm '+(E.section+1)+' kontrolü</h2><b id="examClock"></b><p>'+ids.filter(i=>!formatFull(BANK[i],E.a[i])).length+' boş veya eksik · '+ids.filter(i=>E.flags[i]).length+' işaretli</p><p>'+ids.map((id,j)=>'<button style="background:'+(E.flags[id]?'#946a25':formatFull(BANK[id],E.a[id])?'#5145d9':'#8791a4')+'" onclick="jumpExam('+(lo+j)+')">'+(lo+j+1)+'</button>').join('')+'</p><p>Onaydan sonra bu bölüme geri dönemezsin.</p><button onclick="examPage()">Sorulara dön</button><button onclick="completeSection(true)">'+(E.section===2?'Sınavı bitir':'Onayla ve 10 dk mola')+'</button>'+(E.section<2?'<button onclick="completeSection(false)">Molayı atla</button>':'')+'</section>';clock();if(!E.finished)timer=setInterval(clock,1000)};
examResult=function(){clearInterval(timer);let ids=E.order.filter(i=>!E.unscored.includes(i)),r=ids.filter(correctExam).length,blank=ids.filter(i=>!formatFull(BANK[i],E.a[i])).length;let s='<section><h2>Deneme sonucu</h2><h1>%'+Math.round(r/170*100)+'</h1><p>'+r+' doğru · '+(170-r-blank)+' yanlış · '+blank+' boş / eksik</p><p>170 puanlanan soru · 10 puan dışı</p><p>Çalışma hedefi: %'+S.goal+'</p></section><section><h3>Alan analizi</h3>';for(let d of Object.keys(domainTargets)){let a=ids.filter(i=>BANK[i].domain===d);s+='<p>'+d+' — '+a.filter(correctExam).length+'/'+a.length+'</p>'}s+='<h3>Soru türü analizi</h3>';for(let t of new Set(ids.map(i=>formatType(BANK[i])))){let a=ids.filter(i=>formatType(BANK[i])===t);s+='<p>'+htmlSafe(formatNames[t])+' — '+a.filter(correctExam).length+'/'+a.length+'</p>'}s+='<h3>Konu analizi</h3>';for(let t of new Set(ids.map(i=>BANK[i].topic))){let a=ids.filter(i=>BANK[i].topic===t);s+='<p>'+htmlSafe(t)+' '+a.filter(correctExam).length+'/'+a.length+'</p>'}s+='</section><section><h3>Cevap inceleme</h3>';for(let j=0;j<E.order.length;j++){let id=E.order[j],q=BANK[id],a=E.a[id];s+='<details><summary>'+(j+1)+'. '+(correctExam(id)?'Doğru':!formatFull(q,a)?'Boş / eksik':'Yanlış')+' · '+htmlSafe(q.topic)+(E.unscored.includes(id)?' · Puan dışı':'')+'</summary>'+(q.context?'<p>'+htmlSafe(q.context)+'</p>':'')+formatVisual(q,a,'review',true)+'<p>'+htmlSafe(q.q)+'</p><p>Senin cevabın: '+htmlSafe(formatText(q,a))+'</p><p>Doğru cevap: '+htmlSafe(formatText(q,formatKey(q)))+'</p><p>'+htmlSafe(q.ex)+'</p></details>'}v.innerHTML=s+'</section><button onclick="examHome()">Denemelere dön</button>'};
bankPractice=function(n,ids){clearInterval(timer);P={ids:shuffle((ids||BANK.map((_,i)=>i)).slice()).slice(0,n),pos:0,a:null,right:0,checked:false};bankDraw()};

bankPick=function(k){if(P.checked)return;let q=BANK[P.ids[P.pos]];if(q.multi){let a=Array.isArray(P.a)?P.a.slice():[];if(a.includes(k))a=a.filter(x=>x!==k);else if(a.length<2)a.push(k);P.a=a}else P.a=k;bankDraw()};
